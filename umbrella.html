<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Umbrella">
<meta name="theme-color" content="#05070c">
<title>Umbrella Walk</title>
<style>
  :root {
    --panel: rgba(12, 18, 32, 0.74);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #7dd3fc;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070c; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(5, 7, 12, 0.55); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px); z-index: 10; text-align: center; padding: 24px;
  }
  #start h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: 0.02em; }
  #start p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  #start a { color: var(--muted); font-size: 13px; }
  button {
    font: inherit; color: var(--text); background: rgba(125, 211, 252, 0.15);
    border: 1px solid rgba(125, 211, 252, 0.4); border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
  }
  button:active { background: rgba(125, 211, 252, 0.3); }
  #startBtn { font-size: 17px; padding: 14px 32px; }
  #panel {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--panel); border-radius: 18px; padding: 14px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: grid; gap: 10px; z-index: 5; transition: transform .3s, opacity .3s;
    max-width: 480px; margin: 0 auto;
  }
  #panel.hidden { transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }
  .row { display: grid; grid-template-columns: 44px 1fr 78px; align-items: center; gap: 10px; font-size: 13px; }
  .row span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); touch-action: pan-x; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .buttons button { flex: 1; font-size: 13px; padding: 8px 10px; white-space: nowrap; min-width: 0; }
  @media (max-width: 380px) {
    .buttons { gap: 6px; }
    .buttons button { font-size: 12px; padding: 8px 4px; }
    .row { grid-template-columns: 38px 1fr 70px; }
  }
  button.on { background: rgba(125, 211, 252, 0.35); }
  #stats { font-size: 11.5px; color: var(--muted); line-height: 1.6; font-variant-numeric: tabular-nums; }
  #hud {
    position: fixed; left: 14px; top: calc(18px + env(safe-area-inset-top));
    z-index: 6; font-size: 13px; color: var(--text); text-shadow: 0 1px 4px #000;
    font-variant-numeric: tabular-nums; pointer-events: none; transition: opacity .6s; opacity: 0;
  }
  #toggle {
    position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top));
    z-index: 6; padding: 8px 14px; font-size: 13px; background: var(--panel);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <h1>☂ ビニール傘で雨の街を歩く</h1>
  <p>透明な傘越しに見る夜の街<br>
     タップで 歩く／立ち止まる・左右スワイプで風</p>
  <button id="startBtn">歩きはじめる（音あり）</button>
  <a href="index.html">窓辺の雨にもどる</a>
</div>

<div id="hud"></div>
<button id="toggle">設定</button>

<div id="panel" class="hidden">
  <div class="row"><span>雨量</span><input id="rate" type="range" min="0" max="100" value="55"><span id="rateVal"></span></div>
  <div class="row"><span>風</span><input id="wind" type="range" min="-150" max="150" value="10"><span id="windVal"></span></div>
  <div class="row"><span>音量</span><input id="volume" type="range" min="0" max="100" value="60"><span id="volumeVal"></span></div>
  <div class="buttons">
    <button id="walkBtn" class="on">歩く</button>
    <button id="focusBtn">ピント: 街</button>
    <button id="thunderBtn">雷</button>
    <button id="windowBtn">窓辺へ</button>
  </div>
  <div id="stats"></div>
</div>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const G = 9.81;
  const SOUND_SPEED = 343;
  const EYE = 1.6;                 // eye height (m)
  const WALK_SPEED = 1.3;          // m/s, a relaxed walk
  const STEP_HZ = 1.9;             // steps per second
  const EXPOSURE = 0.03;           // s — motion-blur time of the eye
  const APERTURE = 0.006;          // m — night-adapted pupil diameter (depth of field)
  // Where the eye is focused: down the street (9 m) or on the umbrella (0.55 m).
  // Accommodation takes a few hundred ms; looking at the umbrella we also tilt the head up.
  let focusD = 9, focusNear = false, pitch = 0;
  const ZN = 0.35, ZF = 26;        // depth range of the simulated rain (m)
  const RHO = 1000, SIGMA = 0.072, MU = 0.001;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1, f = 1, cx = 0, cy = 0;

  const state = {
    rate: 7, rateNow: 7, wind0: 1, wind: 1, volume: 0.6,
    walking: true, speed: WALK_SPEED,
  };

  // ---------- helpers ----------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const mkCanvas = (w, h) => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    return c;
  };
  const NOISE_N = 512, noiseTab = new Float32Array(NOISE_N).map(() => Math.random() * 2 - 1);
  function noise1(x) {
    const i = Math.floor(x), t = x - i, u = t * t * (3 - 2 * t);
    const a = noiseTab[i & (NOISE_N - 1)], b = noiseTab[(i + 1) & (NOISE_N - 1)];
    return a + (b - a) * u;
  }
  function pink1(t, seed) {
    let v = 0, norm = 0;
    for (let o = 0; o < 6; o++) {
      const fr = Math.pow(2, o), w = 1 / Math.sqrt(fr);
      v += w * noise1(t * fr + seed + o * 37.1); norm += w;
    }
    return v / norm * 1.8;
  }
  // a seeded PRNG so the city is the same each time you pass a given block
  function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; }

  // ---------- rain physics (as in the window scene) ----------
  const termVel = D => Math.max(0.1, 9.65 - 10.3 * Math.exp(-0.6 * D));        // Atlas et al. 1973
  const mpLambda = R => 4.1 * Math.pow(Math.max(R, 0.05), -0.21);              // Marshall–Palmer
  function sampleD(R, dmin = 0.5, dmax = 6) {
    const L = mpLambda(R);
    return dmin - Math.log(1 - Math.random() * (1 - Math.exp(-L * (dmax - dmin)))) / L;
  }
  const visibleDensity = R => { const L = mpLambda(R); return 8000 / L * Math.exp(-0.5 * L); };
  const rateFromSlider = s => 0.3 * Math.pow(100 / 0.3, s / 100);
  const rainClass = R => R < 1 ? '小雨' : R < 10 ? '雨' : R < 20 ? 'やや強い雨' : R < 30 ? '強い雨'
    : R < 50 ? '激しい雨' : R < 80 ? '非常に激しい雨' : '猛烈な雨';

  // ---------- camera: walking gait ----------
  // Walking is an inverted pendulum: the head rises and falls once per step (~3–4 cm)
  // and sways sideways once per stride. We keep the amplitudes small — enough to feel
  // like walking, not enough to make anyone seasick.
  const cam = { z: 0, x: 0, y: EYE, phase: 0 };
  function updateCamera(dt) {
    let target = state.walking ? WALK_SPEED : 0;
    // wait at the curb while the pedestrian light is red (or already blinking and we're not close)
    const it = nextIntersection();
    if (it && cam.z < it.zg0 - 0.2) {
      const sig = signalState(it), dist = it.zg0 - 0.7 - cam.z;
      if (sig === 'red' || (sig === 'blink' && dist > 2)) target = Math.min(target, clamp(dist * 0.9, 0, WALK_SPEED));
    }
    state.speed += (target - state.speed) * Math.min(1, dt / 0.6);      // start/stop over ~½ s
    cam.z += state.speed * dt;
    const k = state.speed / WALK_SPEED;
    cam.phase += TAU * STEP_HZ * dt * k;
    cam.y = EYE + 0.018 * k * Math.cos(cam.phase);
    cam.x = 0.012 * k * Math.sin(cam.phase / 2);
  }

  // ---------- the city: generated in 12 m blocks as we walk ----------
  const SIDE_R = 2.2, SIDE_L = -10.5, CURB = -1.4, ROAD_L = -8.4;
  const SIGNS = ['喫茶', 'ラーメン', '薬', '本', '居酒屋', '花', 'コンビニ', 'パン', '理容', 'クリーニング',
    '酒', 'カフェ', 'そば', '寿司', '古書', '金物', 'ホテル', '歯科'];
  const SIGN_COL = [[255, 80, 70], [255, 200, 80], [90, 200, 255], [120, 230, 140], [255, 150, 60], [230, 230, 240], [200, 120, 255]];
  const blocks = new Map();
  function makeBlock(b) {
    const r = k => hash(b * 97 + k);
    const z0 = b * 12;
    const blk = { z0, z1: z0 + 12, right: [], left: [], lamp: null, vend: null, cross: r(1) < 0.12 };
    // every sixth block a side street crosses our path: a crosswalk with pedestrian signals
    // now and then a covered shopping arcade (アーケード) over the sidewalk, two blocks long
    blk.arcade = b > 2 && (b % 9 === 6 || b % 9 === 7) && b % 6 !== 3;
    blk.inter = b > 0 && b % 6 === 3 ? { zg0: z0 + 3, zg1: z0 + 9, kind: r(300) < 0.5 ? 'cuckoo' : 'piyo', offset: r(301) * 30, sndT: 0 } : null;
    // right side (our side): 1–2 buildings with a shop on the ground floor
    const spans = blk.inter ? [[z0, z0 + 3], [z0 + 9, z0 + 12]] : [[z0, z0 + 12]];
    for (const [sa, sb] of spans)
    for (let i = 0, z = sa; z < sb - 0.5; i++) {
      const len = Math.min(sb - z, 3 + r(10 + i + sa) * 8);
      const shopLit = r(20 + i) < 0.75;
      blk.right.push({
        z0: z, z1: z + len, h: 7 + r(30 + i) * 20,
        tone: 10 + r(40 + i) * 10 | 0,
        shop: !shopLit ? null : len > 6 && r(80 + i) < 0.18
          ? { konbini: true, warm: false, sign: '24H', col: [245, 246, 250] }
          : { warm: r(50 + i) < 0.65, sign: SIGNS[(r(60 + i) * SIGNS.length) | 0], col: SIGN_COL[(r(70 + i) * SIGN_COL.length) | 0] },
        seed: b * 13 + i + sa * 7,
      });
      z += len;
    }
    let z = z0;
    for (let i = 0; z < z0 + 12 - 0.5; i++) {
      const len = Math.min(z0 + 12 - z, 5 + r(110 + i) * 9);
      blk.left.push({ z0: z, z1: z + len, h: 8 + r(130 + i) * 26, tone: 8 + r(140 + i) * 8 | 0,
        shop: r(150 + i) < 0.6 ? { warm: r(160 + i) < 0.6, col: SIGN_COL[(r(170 + i) * SIGN_COL.length) | 0] } : null, seed: b * 31 + i });
      z += len;
    }
    if (b % 2 === 0) blk.lamp = { z: z0 + 3, sodium: r(200) < 0.4 };
    // puddles collect in the low spots of the paving and along the gutter
    blk.puddles = [];
    const np = (r(400) * 3.2) | 0;
    for (let i = 0; i < np; i++) {
      const onWalk = r(410 + i) < 0.55;
      const x = onWalk ? CURB + 0.4 + r(420 + i) * 3 : ROAD_L + 0.5 + r(420 + i) * 6.5, z = z0 + r(430 + i) * 12;
      for (let k = 0; k < 2; k++) blk.puddles.push({ x: x + (r(440 + i * 3 + k) - 0.5) * 0.8, z: z + (r(450 + i * 3 + k) - 0.5) * 1.2,
        rx: 0.3 + r(460 + i * 3 + k) * (onWalk ? 0.7 : 1.4), rz: 0.4 + r(470 + i * 3 + k) * 1.2 });
    }
    if (r(210) < 0.35) blk.vend = { z: z0 + 4 + r(211) * 5, n: 1 + (r(212) < 0.5 ? 1 : 0) };
    return blk;
  }
  // pedestrian signal cycle: 12 s green, 4 s blinking green, 14 s red
  function signalState(it) {
    const t = ((time + it.offset) % 30 + 30) % 30;
    return t < 12 ? 'green' : t < 16 ? 'blink' : 'red';
  }
  function nextIntersection() {
    let best = null;
    for (const blk of blocks.values()) {
      const it = blk.inter;
      if (it && it.zg1 > cam.z && (!best || it.zg0 < best.zg0)) best = it;
    }
    return best;
  }

  const ARC_Y = 3.1, ARC_X0 = CURB - 0.1;
  function inArcade(x, z) {
    const blk = blocks.get(Math.floor(z / 12));
    return !!(blk && blk.arcade && x > ARC_X0 && x < SIDE_R);
  }
  // the arcade: a ceiling with light tubes over the sidewalk, columns along the curb
  function drawArcade(blk) {
    const z0 = blk.z0, z1 = blk.z1;
    const q = (x0, x1, za, zb, y) => {
      const zn = cam.z + 0.25;
      if (zb <= zn) return null;
      za = Math.max(za, zn);
      const a = proj(x0, y, za), ax = a.x, ay = a.y, b = proj(x1, y, za), bx = b.x, by = b.y;
      const c = proj(x1, y, zb), cxx = c.x, cyy = c.y, d = proj(x0, y, zb);
      return [ax, ay, bx, by, cxx, cyy, d.x, d.y];
    };
    ctx.fillStyle = 'rgb(26,27,33)';
    let c = q(ARC_X0, SIDE_R, z0, z1, ARC_Y); if (c) fillQuad(c);
    // fascia along the roof edge
    ctx.fillStyle = 'rgb(38,40,48)';
    c = wallQuad(ARC_X0, z0, z1, ARC_Y - 0.05, ARC_Y + 0.45); if (c) fillQuad(c);
    for (let z = z0 + 2; z < z1; z += 4) {
      // fluorescent tubes: bright strips on the ceiling, and real light sources
      ctx.fillStyle = 'rgba(235,245,255,0.95)';
      c = q(0.3, 0.45, z, z + 1.2, ARC_Y - 0.02); if (c) fillQuad(c);
      lights.push({ x: 0.4, y: ARC_Y - 0.1, z: z + 0.6, col: '235,245,255', I: 6, size: 0.8, refl: 0.3 });
      // columns at the curb
      const zr = z - cam.z;
      if (zr > 0.4) {
        const a = proj(ARC_X0 + 0.05, 0, z), ax = a.x, ay = a.y, b = proj(ARC_X0 + 0.05, ARC_Y, z);
        ctx.strokeStyle = 'rgb(34,36,44)'; ctx.lineWidth = Math.max(1, f * 0.12 / zr);
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  // roof drainage along the arcade edge: a curtain of drops falling onto the curb
  const edgeDrips = [];
  function updateArcadeEdge(dt) {
    for (const blk of blocks.values()) {
      if (!blk.arcade || blk.z1 < cam.z || blk.z0 > cam.z + 30) continue;
      // Q per metre of edge = roof width × R; far too many drops to count — sample them
      const n = Math.min(25, 1.4 * state.rateNow * dt * 12 * quality);
      for (let k = 0; k < n; k++) {
        if (Math.random() > n - k) break;
        edgeDrips.push({ x: ARC_X0 - 0.02, y: ARC_Y, z: blk.z0 + Math.random() * 12, vy: -0.3 * Math.random(), D: 3 + Math.random() * 2 });
      }
    }
    for (let i = edgeDrips.length - 1; i >= 0; i--) {
      const d = edgeDrips[i];
      d.vy -= G * dt; d.y += d.vy * dt;
      if (d.y < 0 || d.z < cam.z) edgeDrips.splice(i, 1);
    }
  }

  function inPuddle(x, z) {
    const blk = blocks.get(Math.floor(z / 12));
    if (!blk) return false;
    for (const q of blk.puddles) if (((x - q.x) / q.rx) ** 2 + ((z - q.z) / q.rz) ** 2 < 1) return true;
    return false;
  }
  // Still water is a near-perfect mirror: inside a puddle the lights are reflected sharply,
  // unlike the long smeared streaks on the rough wet asphalt around it.
  function drawPuddles(bl) {
    const path = new Path2D();
    let any = false;
    for (const blk of bl) for (const q of blk.puddles) {
      const zr = q.z - cam.z;
      if (zr < 0.8 || zr > 70) continue;
      const c = proj(q.x, 0, q.z), rx = f * q.rx / zr, ry = f * cam.y * q.rz / (zr * zr);
      if (c.x + rx < 0 || c.x - rx > W || c.y - ry > H) continue;
      path.moveTo(c.x + rx, c.y); path.ellipse(c.x, c.y, rx, ry, 0, 0, TAU);
      // the mirrored sky, feathered at the water line
      ctx.save();
      ctx.translate(c.x, c.y); ctx.scale(rx, ry);
      const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
      const sky = c.y < cy + (H - cy) * 0.3 ? '48,44,60' : '22,24,34';
      gr.addColorStop(0, `rgba(${sky},0.55)`); gr.addColorStop(0.75, `rgba(${sky},0.45)`); gr.addColorStop(1, `rgba(${sky},0)`);
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
      ctx.restore();
      any = true;
    }
    if (!any) return;
    ctx.save();
    ctx.clip(path);
    ctx.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      const zr = L.z - cam.z;
      if (zr < 0.8) continue;
      const m = proj(L.x, -L.y, L.z), r = clamp(f * L.size * 0.35 / zr, 2, 40);
      if (m.y > H + r || m.y < cy) continue;
      ctx.globalAlpha = 0.8;
      ctx.drawImage(glowSprite(L.col), m.x - r, m.y - r * 1.6, r * 2, r * 3.2);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function visibleBlocks() {
    const b0 = Math.floor((cam.z - 14) / 12), b1 = Math.floor((cam.z + 130) / 12);
    for (const k of blocks.keys()) if (k < b0) blocks.delete(k);
    const out = [];
    for (let b = b1; b >= b0; b--) {
      if (!blocks.has(b)) blocks.set(b, makeBlock(b));
      out.push(blocks.get(b));
    }
    return out;   // far → near
  }

  // projection of world coordinates
  const PX = { x: 0, y: 0, z: 0 };
  function proj(X, Y, Z) {
    const z = Z - cam.z;
    PX.z = z;
    PX.x = cx + f * (X - cam.x) / z;
    PX.y = cy - f * (Y - cam.y) / z;
    return PX;
  }
  // a vertical quad on the plane x = X between z0..z1, y0..y1 (clipped at the near plane)
  function wallQuad(X, z0, z1, y0, y1) {
    const zn = cam.z + 0.25;
    if (z1 <= zn) return null;
    z0 = Math.max(z0, zn);
    const a = proj(X, y0, z0), ax = a.x, ay = a.y;
    const b = proj(X, y1, z0), bx = b.x, by = b.y;
    const c = proj(X, y1, z1), cxx = c.x, cyy = c.y;
    const d = proj(X, y0, z1);
    return [ax, ay, bx, by, cxx, cyy, d.x, d.y];
  }
  function fillQuad(q) {
    ctx.beginPath();
    ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]); ctx.lineTo(q[4], q[5]); ctx.lineTo(q[6], q[7]);
    ctx.closePath(); ctx.fill();
  }

  // light sources of this frame (for rain illumination and reflections)
  let lights = [];
  // pre-rendered radial glows, one per colour, reused every frame instead of new gradients
  const glowCache = new Map();
  function glowSprite(col, soft) {
    const key = col + (soft ? 's' : '');
    let c = glowCache.get(key);
    if (!c) {
      c = mkCanvas(64, 64);
      const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, `rgba(${col},1)`);
      if (!soft) gr.addColorStop(0.35, `rgba(${col},0.3)`);
      gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      glowCache.set(key, c);
    }
    return c;
  }

  function drawSky() {
    const gr = ctx.createLinearGradient(0, 0, 0, cy);
    gr.addColorStop(0, '#05070d'); gr.addColorStop(0.7, '#141827'); gr.addColorStop(1, '#2c2734');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, W, cy + 1);
    const fl = Math.min(1, flashLevel);
    if (fl > 0.01) {
      // the flash lights the cloud deck from inside
      ctx.globalAlpha = fl;
      ctx.drawImage(skyLit, 0, cy - skyLit.height, W, skyLit.height);
      ctx.globalAlpha = 1;
      drawBolt();
    }
  }
  let skyLit;
  function paintSkyLit() {
    skyLit = mkCanvas(W, H);
    const g = skyLit.getContext('2d');
    let gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#4a5173'); gr.addColorStop(0.7, '#6d7299'); gr.addColorStop(1, '#8a86a6');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 50; i++) {
      const x = Math.random() * W, y = Math.random() * H, r = 30 + Math.random() * 140;
      g.save(); g.translate(x, y); g.scale(1, 0.5);
      gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
      const col = Math.random() < 0.5 ? '225,228,255' : '40,44,70';
      gr.addColorStop(0, `rgba(${col},0.3)`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
      g.restore();
    }
  }

  function drawGround() {
    let gr = ctx.createLinearGradient(0, cy, 0, H);
    gr.addColorStop(0, '#121520'); gr.addColorStop(1, '#07090e');
    ctx.fillStyle = gr;
    ctx.fillRect(0, cy - 1, W, H - cy + 1);
    // sidewalk (slightly lighter tiles) and the curb
    const zn = cam.z + 0.3, zf = cam.z + 400;
    const s0 = proj(CURB, 0, zn), x0 = s0.x, y0 = s0.y;
    const s1 = proj(CURB, 0, zf), x1 = s1.x, y1 = s1.y;
    const s2 = proj(SIDE_R, 0, zf), x2 = s2.x;
    const s3 = proj(SIDE_R, 0, zn), x3 = s3.x;
    ctx.fillStyle = 'rgba(40,42,52,0.35)';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x2, y1); ctx.lineTo(x3, y0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,125,140,0.25)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    // centre line dashes and tile joints give the sense of motion
    ctx.strokeStyle = 'rgba(200,200,190,0.28)';
    for (let z = Math.ceil(cam.z / 6) * 6; z < cam.z + 90; z += 6) {
      const a = proj(-4.9, 0, z + 0.01 < cam.z + 0.5 ? cam.z + 0.5 : z), ax = a.x, ay = a.y;
      const b = proj(-4.9, 0, z + 3);
      ctx.lineWidth = Math.max(0.6, f * 0.12 / (z + 1.5 - cam.z));
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
    for (let z = Math.ceil(cam.z / 0.6) * 0.6; z < cam.z + 25; z += 0.6) {
      if (z < cam.z + 0.5) continue;
      const a = proj(CURB, 0, z), ax = a.x, ay = a.y;
      const b = proj(SIDE_R, 0, z);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }

  // wet ground: every light has a mirror image below the ground plane, smeared toward
  // the viewer by the roughness of the asphalt
  function drawReflections() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      const zr = L.z - cam.z;
      if (zr < 0.6 || !L.refl) continue;
      const g = proj(L.x, 0, L.z), gx = g.x, gy = g.y;
      const m = proj(L.x, -L.y, L.z), my = m.y;
      const w = Math.max(1.5, f * L.size * 0.5 / zr);
      const len = Math.max(w, (my - gy) * 2.2);
      if (gy > H || gx + w < 0 || gx - w > W) continue;
      ctx.globalAlpha = L.refl;
      ctx.drawImage(glowSprite(L.col, true), gx - w, gy, w * 2, len);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function drawBuildingSide(bs, X, facingRight, blk) {
    for (const b of bs) {
      const q = wallQuad(X, b.z0, b.z1, 0, b.h);
      if (!q) continue;
      const t = b.tone;
      ctx.fillStyle = `rgb(${t},${t + 2},${t + 8})`;
      fillQuad(q);
      // windows on the upper floors
      const zr = (b.z0 + b.z1) / 2 - cam.z;
      if (zr < 120) {
        for (let fl = 1; fl * 3.1 + 1 < b.h; fl++) {
          for (let k = 0; k * 2.2 + 1.2 < b.z1 - b.z0; k++) {
            const hv = hash(b.seed * 1000 + fl * 37 + k);
            if (hv > 0.45) continue;
            const wz = b.z0 + 0.6 + k * 2.2, wy = fl * 3.1 + 0.9;
            const wq = wallQuad(X, wz, wz + 1.2, wy, wy + 1.3);
            if (!wq) continue;
            const warm = hv < 0.3;
            ctx.fillStyle = warm ? `rgba(255,${190 + hv * 100 | 0},120,${0.2 + hv * 0.8})` : `rgba(150,180,220,${0.12 + hv * 0.6})`;
            fillQuad(wq);
          }
        }
      }
      // shop front on the ground floor
      if (b.shop) {
        const s = b.shop;
        const wq = wallQuad(X, b.z0 + 0.4, b.z1 - 0.4, 0.15, 2.5);
        if (wq && s.konbini) {
          // a convenience store: evenly lit shelves under banks of fluorescent light
          ctx.fillStyle = 'rgba(248,250,255,0.97)';
          fillQuad(wq);
          ctx.fillStyle = 'rgba(120,130,150,0.35)';
          for (const [y0, y1] of [[0.15, 0.3], [0.7, 0.78], [1.2, 1.28], [1.7, 1.78]]) {
            const iq = wallQuad(X, b.z0 + 0.4, b.z1 - 3, y0, y1);
            if (iq) fillQuad(iq);
          }
        } else if (wq) {
          const gr = ctx.createLinearGradient(0, Math.min(wq[3], wq[5]), 0, Math.max(wq[1], wq[7]));
          const c = s.warm ? '255,205,150' : '215,230,255';
          gr.addColorStop(0, `rgba(${c},0.8)`); gr.addColorStop(0.55, `rgba(${c},0.55)`); gr.addColorStop(1, `rgba(${c},0.35)`);
          ctx.fillStyle = gr;
          fillQuad(wq);
          // shelves and goods inside, and the window mullions
          ctx.fillStyle = 'rgba(40,32,28,0.28)';
          for (const [y0, y1] of [[0.15, 0.9], [1.25, 1.35], [1.75, 1.85]]) {
            const iq = wallQuad(X, b.z0 + 0.4, b.z1 - 0.4, y0, y1);
            if (iq) fillQuad(iq);
          }
          ctx.fillStyle = 'rgba(20,20,26,0.8)';
          for (let mz = b.z0 + 0.4; mz <= b.z1 - 0.35; mz += Math.max(1.2, (b.z1 - b.z0 - 0.8) / 3)) {
            const mq = wallQuad(X, mz, mz + 0.06, 0.15, 2.5);
            if (mq) fillQuad(mq);
          }
        }
        const zc = (b.z0 + b.z1) / 2;
        lights.push({ x: X + (facingRight ? 0.5 : -0.5), y: 1.3, z: zc, col: s.warm ? '255,200,140' : '215,230,255',
          I: s.konbini ? 16 : 7, size: (b.z1 - b.z0) * 0.5, refl: s.konbini ? 0.35 : 0.22 });
        if (s.konbini && !facingRight) drawUmbrellaStand(X - 0.3, b.z0 + 0.7);
        // light spilling out of the window onto the wet pavement, falling off away from the glass
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const c = s.warm ? '255,190,130' : '200,215,255';
        for (const [w, a] of [[2.0, 0.03], [1.5, 0.035], [1.05, 0.04], [0.7, 0.045], [0.35, 0.05]]) {
          const pq = groundQuad(facingRight ? X : X - w, facingRight ? X + w : X, b.z0 + 0.4, b.z1 - 0.4);
          if (pq) { ctx.fillStyle = `rgba(${c},${a})`; fillQuad(pq); }
        }
        ctx.restore();
        if (s.sign !== undefined || s.col) {
          const sq = wallQuad(X, b.z0 + 0.6, b.z1 - 0.6, 2.7, 3.3);
          if (sq && s.konbini) {
            // a generic three-stripe fascia (no real brand)
            const stripes = [['250,250,252', 2.7, 3.3], ['60,170,110', 2.95, 3.05], ['40,110,200', 3.1, 3.2]];
            for (const [c, y0, y1] of stripes) { const st = wallQuad(X, b.z0 + 0.6, b.z1 - 0.6, y0, y1); if (st) { ctx.fillStyle = `rgb(${c})`; fillQuad(st); } }
            lights.push({ x: X + (facingRight ? 0.3 : -0.3), y: 3, z: zc, col: '245,246,250', I: 5, size: 1.5, refl: 0.35 });
          } else if (sq) {
            ctx.fillStyle = `rgba(${s.col},0.9)`;
            fillQuad(sq);
            if (s.sign && zc - cam.z < 40) drawSignText(sq, s.sign, facingRight);
            lights.push({ x: X + (facingRight ? 0.3 : -0.3), y: 3, z: zc, col: s.col.join(','), I: 3, size: 1, refl: 0.3 });
          }
        }
      }
    }
  }

  // the umbrella stand by the door: a row of folded clear umbrellas, handles up
  function drawUmbrellaStand(X, z0) {
    for (let k = 0; k < 6; k++) {
      const z = z0 + k * 0.12, zr = z - cam.z;
      if (zr < 0.6) continue;
      const lean = 0.06 * Math.sin(k * 2.3);
      const a = proj(X, 0.05, z), ax = a.x, ay = a.y;
      const b = proj(X + lean, 0.75, z), bx = b.x, by = b.y;
      const w = f * 0.035 / zr;
      ctx.fillStyle = 'rgba(225,232,245,0.35)';
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx - w, by); ctx.lineTo(bx + w, by); ctx.closePath(); ctx.fill();
      const h = proj(X + lean, 0.9, z);
      ctx.strokeStyle = 'rgba(235,238,245,0.7)'; ctx.lineWidth = Math.max(0.6, f * 0.012 / zr);
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(h.x, h.y);
      ctx.arc(h.x - f * 0.03 / zr, h.y, f * 0.03 / zr, 0, Math.PI, true); ctx.stroke();
    }
  }

  // text on a sign: an affine map from sign space onto the projected quad (good enough
  // for a small sign; the exact perspective is barely visible)
  function drawSignText(q, text, facingRight) {
    // q: a=(z0,bottom) b=(z0,top) c=(z1,top) d=(z1,bottom)
    const [ax, ay, bx, by, cxx, cyy] = q;
    const w = Math.hypot(cxx - bx, cyy - by);
    if (w < 14) return;
    ctx.save();
    // sign space: u along the facade (0..100), v down (0..20)
    ctx.transform((cxx - bx) / 100, (cyy - by) / 100, (ax - bx) / 20, (ay - by) / 20, bx, by);
    if (!facingRight) { ctx.translate(100, 0); ctx.scale(-1, 1); }
    ctx.fillStyle = 'rgba(20,16,14,0.92)';
    ctx.font = 'bold 15px "Hiragino Sans", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 50, 10.5);
    ctx.restore();
  }

  function drawVending(v) {
    // front face at x = 1.45 facing the sidewalk
    const X = SIDE_R - 0.75;
    for (let k = 0; k < v.n; k++) {
      const z0 = v.z + k * 1.0, z1 = z0 + 0.95;
      const q = wallQuad(X, z0, z1, 0.05, 1.83);
      if (!q) continue;
      ctx.fillStyle = 'rgba(240,246,255,0.95)';
      fillQuad(q);
      // three rows of drinks behind the display window
      const cols = ['220,60,50', '60,120,220', '240,190,40', '60,170,90', '230,230,230'];
      for (let row = 0; row < 3; row++) {
        for (let i = 0; i < 6; i++) {
          const cz = z0 + 0.1 + i * 0.13, cyy = 1.15 + row * 0.2;
          const dq = wallQuad(X - 0.001, cz, cz + 0.08, cyy, cyy + 0.14);
          if (!dq) continue;
          ctx.fillStyle = `rgb(${cols[(row * 7 + i * 3 + k) % cols.length]})`;
          fillQuad(dq);
        }
      }
      ctx.fillStyle = 'rgba(20,30,50,0.55)';
      const lq = wallQuad(X - 0.001, z0 + 0.1, z1 - 0.1, 0.1, 0.6);
      if (lq) fillQuad(lq);
      lights.push({ x: X - 0.2, y: 1.2, z: (z0 + z1) / 2, col: '230,240,255', I: 9, size: 0.9, refl: 0.35 });
    }
  }

  function drawLamp(L) {
    const Xp = CURB + 0.25, Xh = CURB - 0.7, Hh = 5.2;
    const zr = L.z - cam.z;
    if (zr < 0.4) return;
    const a = proj(Xp, 0, L.z), ax = a.x, ay = a.y;
    const b = proj(Xp, Hh, L.z), bx = b.x, by = b.y;
    const c = proj(Xh, Hh, L.z), hx = c.x, hy = c.y;
    ctx.strokeStyle = '#1b1e28';
    ctx.lineWidth = Math.max(0.6, f * 0.13 / zr);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(hx, hy); ctx.stroke();
    const col = L.sodium ? '255,172,92' : '235,240,255';
    const r = f * 2.2 / zr;
    const gr = ctx.createRadialGradient(hx, hy, 0, hx, hy, r);
    gr.addColorStop(0, `rgba(${col},0.7)`); gr.addColorStop(0.3, `rgba(${col},0.15)`); gr.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gr;
    ctx.fillRect(hx - r, hy - r, r * 2, r * 2);
    ctx.fillStyle = 'rgba(255,250,240,0.95)';
    ctx.beginPath(); ctx.arc(hx, hy, Math.max(0.8, f * 0.12 / zr), 0, TAU); ctx.fill();
    lights.push({ x: Xh, y: Hh - 0.2, z: L.z, col, I: 18, size: 2, refl: 0.3 });
  }

  // ---------- traffic ----------
  // Japan drives on the left: oncoming cars use the lane next to our sidewalk (x ≈ −3.1),
  // cars going our way the far lane. Headlights are beams that light the rain ahead of them,
  // tyres throw up spray, and their hiss is Doppler shifted, f' = f·c/(c − v_r).
  const cars = [];
  let nextCar = 2;
  function spawnCar() {
    const oncoming = Math.random() < 0.6, v = 8 + Math.random() * 6;
    cars.push({ x: oncoming ? -3.1 : -6.7, z: oncoming ? cam.z + 170 : cam.z - 6, vz: oncoming ? -v : v, oncoming,
      voice: audio ? audio.carVoice() : null });
  }
  function updateCars(dt) {
    nextCar -= dt;
    if (nextCar <= 0) { if (cars.length < 4) spawnCar(); nextCar = 4 + Math.random() * 11; }
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i];
      c.z += c.vz * dt;
      const zr = c.z - cam.z;
      if (zr < -10 || zr > 200) { if (c.voice) c.voice.stop(); cars.splice(i, 1); continue; }
      if (zr > 0 && zr < 40 && splashes.length < 600 * quality && Math.random() < dt * 90 * Math.min(1, 0.3 + state.rateNow / 20)) {
        const rear = zr - Math.sign(c.vz) * 1.3;
        for (let k = 0; k < 2; k++) {
          splashes.push({ x: c.x - cam.x + (Math.random() < 0.5 ? -0.8 : 0.8), y: -cam.y + 0.05, z: rear,
            vx: (Math.random() - 0.5) * 2, vy: 0.6 + Math.random() * 2.2, vz: c.vz * (0.15 + Math.random() * 0.3), D: 0.3 + Math.random() * 0.8 });
        }
      }
      if (c.voice) {
        const dx = c.x - cam.x, r = Math.hypot(dx, cam.y, zr);
        const vr = -zr * (c.vz - state.speed) / r;                // closing speed
        c.voice.set(Math.min(1, 7.5 / r), SOUND_SPEED / (SOUND_SPEED - vr), dx / r * 1.5, r);
      }
    }
  }
  function drawCars() {
    for (const c of cars) {
      const zr = c.z - cam.z;
      if (zr < 1) continue;
      const P = (x, y) => { const p = proj(c.x + x, y, c.z); return [p.x, p.y]; };
      const [x0, y0] = P(-0.9, 0.25), [x1, y1] = P(0.9, 0.95), [x2, y2] = P(-0.7, 1.45), [x3] = P(0.7, 1.45);
      ctx.fillStyle = 'rgba(8,10,15,0.94)';
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y2); ctx.lineTo(x1, y1); ctx.lineTo(x1, y0);
      ctx.closePath(); ctx.fill();
      const coc = f * APERTURE * Math.abs(1 / zr - 1 / focusD);
      const col = c.oncoming ? '255,246,228' : '255,40,28';
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const sx0 of [-0.72, 0.72]) {
        const ly = c.oncoming ? 0.7 : 0.9;
        const [sx, sy] = P(sx0, ly);
        const r = f * (c.oncoming ? 1.4 : 0.45) / zr + coc * 1.5;
        const a = (c.oncoming ? 0.95 : 0.8) / (1 + coc * 0.08);
        const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
        gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.15, `rgba(${col},${a * 0.5})`); gr.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = gr;
        ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
        lights.push({ x: c.x + sx0, y: ly, z: c.z, col, I: c.oncoming ? 50 : 4, size: 0.5, refl: c.oncoming ? 0.4 : 0.35,
          bz: c.oncoming ? -1 : 1, by: -0.08, white: c.oncoming });
      }
      ctx.restore();
    }
  }

  // ---------- people under umbrellas ----------
  // Many carry the same clear vinyl umbrella; some black, navy, beige or red. When two
  // people pass on a narrow sidewalk both tilt their umbrellas away from each other
  // (傘かしげ, an old Edo courtesy) — so do we.
  const peds = [];
  let nextPed = 0.5;
  const UMB_KINDS = [['vinyl'], ['vinyl'], ['vinyl'], ['vinyl'], ['20,22,28'], ['28,36,70'], ['190,170,140'], ['170,30,40']];
  function spawnPed(initial) {
    const ours = Math.random() < 0.55, toward = Math.random() < 0.75;
    const v = 1.05 + Math.random() * 0.45;
    const x = ours ? -0.7 + (Math.random() - 0.5) * 0.3 : -9.55 + (Math.random() - 0.5) * 0.6;
    const z = cam.z + (initial ? 6 + Math.random() * 60 : toward ? 70 + Math.random() * 40 : 8 + Math.random() * 30);
    peds.push({ x, z, vz: toward ? -v : v * (0.6 + Math.random() * 0.3), phase: Math.random() * TAU, ours,
      kind: UMB_KINDS[(Math.random() * UMB_KINDS.length) | 0][0], h: 1.5 + Math.random() * 0.35, tilt: 0, lastStep: 0 });
  }
  let courtesy = 0;                                   // our own umbrella tilt when passing someone
  function updatePeds(dt) {
    nextPed -= dt;
    if (nextPed <= 0) { if (peds.length < 12) spawnPed(false); nextPed = 1.5 + Math.random() * 4; }
    let pass = 0;
    for (let i = peds.length - 1; i >= 0; i--) {
      const p = peds[i];
      p.z += p.vz * dt;
      p.phase += TAU * STEP_HZ * dt * Math.abs(p.vz) / WALK_SPEED;
      const zr = p.z - cam.z;
      if (zr < -3 || zr > 160) { peds.splice(i, 1); continue; }
      const near = p.ours && zr > -1 && zr < 4.5;
      p.tilt += ((near ? -0.4 : 0) - p.tilt) * Math.min(1, dt * 3);
      if (near) pass = 1;
      // their footsteps, when close enough to hear
      const st = Math.floor(p.phase / Math.PI);
      if (st !== p.lastStep) {
        p.lastStep = st;
        const r = Math.hypot(p.x - cam.x, zr);
        if (audio && r < 9) audio.otherStep(Math.min(1, 1.2 / r), clamp((p.x - cam.x) / r, -1, 1));
      }
    }
    courtesy += (pass * 0.28 - courtesy) * Math.min(1, dt * 3);
  }
  function drawPeds() {
    peds.sort((a, b) => b.z - a.z);
    for (const p of peds) {
      const zr = p.z - cam.z;
      if (zr < 0.8) continue;
      const P = (x, y) => { const q = proj(p.x + x, y, p.z); return [q.x, q.y]; };
      const s = f / zr;                                   // px per metre at this depth
      const [fx, fy] = P(0, 0);
      if (fx < -s * 1.2 || fx > W + s * 1.2) continue;
      const fog = Math.exp(-zr / 60);
      // legs swing with the gait
      const sw = 0.22 * Math.sin(p.phase);
      ctx.strokeStyle = `rgba(10,12,16,${0.95 * fog})`;
      ctx.lineWidth = Math.max(0.8, 0.12 * s);
      ctx.lineCap = 'round';
      const [hx, hy] = P(0, 0.85);
      for (const k of [1, -1]) { const [lx, ly] = P(0.08 * k, 0.02); ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(lx, ly + sw * k * s * 0.4 * Math.sign(p.vz)); ctx.stroke(); }
      // coat and head
      ctx.fillStyle = `rgba(22,24,32,${0.96 * fog})`;
      const [bx, by] = P(-0.21, p.h - 0.28), [bx2, by2] = P(0.21, 0.8);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, bx2 - bx, by2 - by, 0.08 * s); else ctx.rect(bx, by, bx2 - bx, by2 - by);
      ctx.fill();
      // rim light from the shop windows (right) and the street lamps (left)
      ctx.strokeStyle = `rgba(255,215,170,${0.35 * fog})`; ctx.lineWidth = Math.max(0.6, 0.025 * s);
      ctx.beginPath(); ctx.moveTo(bx2, by + 0.08 * s); ctx.lineTo(bx2, by2); ctx.stroke();
      ctx.strokeStyle = `rgba(200,210,235,${0.18 * fog})`;
      ctx.beginPath(); ctx.moveTo(bx, by + 0.08 * s); ctx.lineTo(bx, by2); ctx.stroke();
      const [nx, ny] = P(0, p.h - 0.13);
      ctx.beginPath(); ctx.arc(nx, ny, 0.105 * s, 0, TAU); ctx.fill();
      // the umbrella: a shallow dome above the head, tilted when passing us
      const [ux, uy] = P(0.05 + p.tilt * 0.5, p.h + 0.3);
      const rx = 0.5 * s, ry = 0.2 * s;
      ctx.save();
      ctx.translate(ux, uy); ctx.rotate(p.tilt);
      ctx.strokeStyle = `rgba(30,32,38,${0.8 * fog})`; ctx.lineWidth = Math.max(0.6, 0.015 * s);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 0.45 * s); ctx.stroke();            // shaft
      ctx.beginPath();
      ctx.moveTo(-rx, ry * 0.25);
      ctx.bezierCurveTo(-rx * 0.9, -ry * 1.2, rx * 0.9, -ry * 1.2, rx, ry * 0.25);
      for (let k = 3; k >= -3; k--) ctx.quadraticCurveTo(rx * (k + 0.5) / 4, ry * 0.05, rx * k / 4, ry * 0.25);   // scalloped rim
      ctx.closePath();
      if (p.kind === 'vinyl') {
        ctx.fillStyle = `rgba(225,232,245,${0.16 * fog})`; ctx.fill();
        ctx.strokeStyle = `rgba(235,240,250,${0.45 * fog})`; ctx.lineWidth = Math.max(0.5, 0.012 * s); ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(${p.kind},${0.95 * fog})`; ctx.fill();
        ctx.strokeStyle = `rgba(200,210,230,${0.18 * fog})`; ctx.lineWidth = Math.max(0.5, 0.01 * s); ctx.stroke();  // wet sheen
      }
      ctx.restore();
    }
  }

  function groundQuad(x0, x1, z0, z1) {
    const zn = cam.z + 0.3;
    if (z1 <= zn) return null;
    z0 = Math.max(z0, zn);
    const a = proj(x0, 0, z0), ax = a.x, ay = a.y, b = proj(x1, 0, z0), bx = b.x, by = b.y;
    const c = proj(x1, 0, z1), cxx = c.x, cyy = c.y, d = proj(x0, 0, z1);
    return [ax, ay, bx, by, cxx, cyy, d.x, d.y];
  }
  function drawIntersection(it) {
    const { zg0, zg1 } = it;
    // the side street opening to the right: asphalt, a far facade and the corner wall facing us
    ctx.fillStyle = '#0d1018';
    let q = groundQuad(SIDE_R, 40, zg0, zg1); if (q) fillQuad(q);
    ctx.fillStyle = 'rgb(14,16,24)';
    q = wallQuad(30, zg0 - 2, zg1 + 2, 0, 14); if (q) fillQuad(q);
    for (let k = 0; k < 6; k++) {
      const hv = hash(it.offset * 1000 + k | 0);
      if (hv > 0.5) continue;
      const wy = 3 + (k % 3) * 3.2, wz = zg0 + (k >> 1) * 2;
      q = wallQuad(30, wz, wz + 1.1, wy, wy + 1.2);
      if (q) { ctx.fillStyle = `rgba(255,${200 + hv * 80 | 0},130,${0.3 + hv})`; fillQuad(q); }
    }
    if (zg1 - cam.z > 0.3) {
      const P = (x, y) => { const p = proj(x, y, zg1); return [p.x, p.y]; };
      const [a0, a1] = P(SIDE_R, 0), [b0, b1] = P(30, 0), [c0, c1] = P(30, 16), [d0, d1] = P(SIDE_R, 16);
      ctx.fillStyle = 'rgb(18,20,28)';
      ctx.beginPath(); ctx.moveTo(a0, a1); ctx.lineTo(b0, b1); ctx.lineTo(c0, c1); ctx.lineTo(d0, d1); ctx.closePath(); ctx.fill();
    }
    // zebra crossing: 45 cm bars parallel to the side street's traffic, 45 cm apart
    ctx.fillStyle = 'rgba(200,202,210,0.32)';
    for (let z = zg0 + 0.4; z < zg1 - 0.3; z += 0.9) {
      q = groundQuad(CURB + 0.1, SIDE_R - 0.1, z, z + 0.45);
      if (q) fillQuad(q);
    }
    // the pedestrian signal on the far corner, facing us
    const sig = signalState(it);
    const on = sig === 'green' || (sig === 'blink' && (time * 2 % 1) < 0.5);
    const Z = zg1 + 0.15, X = SIDE_R - 0.2;
    if (Z - cam.z > 0.5) {
      const P = (x, y) => { const p = proj(x, y, Z); return [p.x, p.y]; };
      const [px0, py0] = P(X, 0), [px1, py1] = P(X, 2.2);
      ctx.strokeStyle = '#20232c'; ctx.lineWidth = Math.max(0.8, f * 0.08 / (Z - cam.z));
      ctx.beginPath(); ctx.moveTo(px0, py0); ctx.lineTo(px1, py1); ctx.stroke();
      const [bx, by] = P(X - 0.2, 3.0), [bx2, by2] = P(X + 0.2, 2.2);
      ctx.fillStyle = '#15171d'; ctx.fillRect(bx, by, bx2 - bx, by2 - by);
      const s = f / (Z - cam.z);
      const lamp = (yc, col, lit, walking) => {
        const [lx, ly] = P(X, yc);
        if (lit) {
          const r = 0.9 * s, gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, r);
          gr.addColorStop(0, `rgba(${col},0.5)`); gr.addColorStop(1, `rgba(${col},0)`);
          ctx.fillStyle = gr; ctx.fillRect(lx - r, ly - r, r * 2, r * 2);
        }
        ctx.fillStyle = lit ? `rgb(${col})` : 'rgba(40,40,45,0.9)';
        // pictogram: the standing / walking figure
        ctx.beginPath(); ctx.arc(lx, ly - 0.09 * s, 0.035 * s, 0, TAU); ctx.fill();
        ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(0.6, 0.03 * s);
        ctx.beginPath(); ctx.moveTo(lx, ly - 0.05 * s); ctx.lineTo(lx, ly + 0.04 * s);
        if (walking) { ctx.lineTo(lx - 0.05 * s, ly + 0.12 * s); ctx.moveTo(lx, ly + 0.04 * s); ctx.lineTo(lx + 0.05 * s, ly + 0.12 * s); }
        else { ctx.lineTo(lx - 0.02 * s, ly + 0.12 * s); ctx.moveTo(lx, ly + 0.04 * s); ctx.lineTo(lx + 0.02 * s, ly + 0.12 * s); }
        ctx.stroke();
      };
      lamp(2.8, '255,60,50', sig === 'red', false);
      lamp(2.4, '60,255,170', on, true);
      lights.push({ x: X, y: sig === 'red' ? 2.8 : 2.4, z: Z, col: sig === 'red' ? '255,60,50' : '60,255,170', I: on || sig === 'red' ? 5 : 0, size: 0.4, refl: on || sig === 'red' ? 0.45 : 0 });
    }
  }

  // 音響式信号機: while green, the crossing plays a cuckoo call (カッコー) or a chick chirp
  // (ピヨピヨ); it falls silent when the green starts blinking
  function updateSignalSound(dt) {
    if (!audio) return;
    for (const blk of blocks.values()) {
      const it = blk.inter;
      if (!it) continue;
      const zr = (it.zg0 + it.zg1) / 2 - cam.z, r = Math.hypot(zr, 2);
      if (r > 70 || signalState(it) !== 'green') { it.sndT = 0; continue; }
      it.sndT -= dt;
      if (it.sndT <= 0) {
        it.sndT = it.kind === 'cuckoo' ? 1.5 : 0.55;
        audio.signal(it.kind, Math.min(1, 4 / r), clamp(2 / r, -1, 1));
      }
    }
  }

  function drawCity() {
    lights = [];
    const bl = visibleBlocks();
    // far side of the road first, then lamps and traffic, then our side (near → covers far)
    for (const blk of bl) drawBuildingSide(blk.left, SIDE_L, true, blk);
    for (const blk of bl) if (blk.lamp) drawLamp(blk.lamp);
    drawCars();
    for (const blk of bl) {
      if (blk.inter) drawIntersection(blk.inter);
      drawBuildingSide(blk.right, SIDE_R, false, blk);
      if (blk.vend) drawVending(blk.vend);
      if (blk.arcade) drawArcade(blk);
    }
    drawPeds();
  }

  // ---------- rain around us ----------
  const drops = [], splashes = [], ripples = [];
  function spawnDrop(d, initial) {
    d.z = Math.sqrt(ZN * ZN + Math.random() * (ZF * ZF - ZN * ZN));
    d.D = sampleD(state.rateNow);
    d.v = termVel(d.D);
    const hw = W / 2 + 30, top = cy + 30;
    d.xl = -hw * d.z / f; d.xr = hw * d.z / f;
    const ytop = top * d.z / f;                                  // camera-relative
    const drift = state.wind * (ytop + EYE) / d.v;
    d.x = d.xl - Math.max(0, drift) + Math.random() * (d.xr - d.xl + Math.abs(drift));
    d.y = initial ? -EYE + Math.random() * (ytop + EYE) : ytop + Math.random() * 0.3;
    d.vx = state.wind;
    if (initial && underUmbrella(d.x, d.y, d.z)) d.y = ytop;
    d.side = canopySide(d.x, d.y, d.z);
    return d;
  }
  const targetDropCount = () => quality * Math.min(3500, 2.2 * visibleDensity(state.rateNow) * (W * H) / (390 * 844));

  function impact(d) {
    if (d.z > 12) return;
    if (ripples.length < 260 * quality && inPuddle(d.x + cam.x, d.z + cam.z)) {
      ripples.push({ x: d.x + cam.x, z: d.z + cam.z, age: 0, amp: Math.min(1, Math.sqrt(d.D ** 3 * d.v * d.v) / 40) });
    }
    // Cossali et al.: crown splash on a wet surface when K = We·Oh^−0.4 > 2100 + 5880·δ^1.44
    const Dm = d.D * 1e-3, We = RHO * Dm * d.v * d.v / SIGMA, Oh = MU / Math.sqrt(RHO * SIGMA * Dm);
    const K = We * Math.pow(Oh, -0.4), Kc = 2100 + 5880 * Math.pow(Math.min(0.5 / d.D, 1.5), 1.44);
    if (d.z < 7 && K > Kc && splashes.length < 600 * quality) {
      const ex = K / Kc - 1, n = Math.min(10, (2 + 3 * ex + Math.random() * 2) | 0), s0 = d.v * (0.12 + 0.05 * Math.min(ex, 3));
      for (let k = 0; k < n; k++) {
        const el = (15 + Math.random() * 50) * Math.PI / 180, az = Math.random() * TAU, sp = s0 * (0.6 + Math.random() * 0.8);
        splashes.push({ x: d.x, y: -EYE + 0.001, z: d.z, vx: sp * Math.cos(el) * Math.cos(az) + d.vx * 0.2,
          vy: sp * Math.sin(el), vz: sp * Math.cos(el) * Math.sin(az), D: d.D * (0.1 + Math.random() * 0.25) / Math.sqrt(1 + ex) });
      }
    }
  }

  function updateRain(dt) {
    const target = targetDropCount() | 0;
    while (drops.length < target) drops.push(spawnDrop({}, true));
    if (drops.length > target) drops.length = target;
    const vz = -state.speed;            // the world streams toward us as we walk
    const dy = cam.y - camYPrev;
    for (const d of drops) {
      const tau = d.v / G;
      d.vx += (state.wind - d.vx) * Math.min(1, dt / tau);
      d.x += d.vx * dt;
      d.y -= d.v * dt + dy;
      d.z += vz * dt;
      if (d.y <= -cam.y) { impact(d); spawnDrop(d, false); }
      else if (d.y + cam.y < ARC_Y && inArcade(d.x + cam.x, d.z + cam.z)) spawnDrop(d, false);   // lands on the roof
      else if (d.z < ZN * 0.5 || d.x < d.xl - 3 || d.x > d.xr + 3) spawnDrop(d, false);
      else {
        const side = canopySide(d.x, d.y, d.z);
        if (side === -1 && d.side === 1) { canopyHit(d); spawnDrop(d, false); d.side = canopySide(d.x, d.y, d.z); }
        else d.side = side;
      }
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.vy -= G * dt;
      s.x += s.vx * dt; s.y += s.vy * dt - dy; s.z += (s.vz + vz) * dt;
      if (s.y < -cam.y || s.z < 0.2) { splashes[i] = splashes[splashes.length - 1]; splashes.pop(); }
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      if (r.age > 1.4 || r.z < cam.z + 0.3) { ripples[i] = ripples[ripples.length - 1]; ripples.pop(); }
    }
  }
  let camYPrev = EYE;

  // ---------- lighting of the rain ----------
  const AB = 7, AMAX = 0.85, WB = 5, WREP = [0.6, 1.1, 1.9, 3.2, 5.5], WEDGE = [0.85, 1.5, 2.5, 4.2];
  const TINTS = ['200,208,225', '255,208,160', '235,240,255'];
  let buckets = [];
  function bucket(alpha, width, tint) {
    if (alpha < 0.012) return null;
    const ai = Math.min(AB - 1, (alpha / AMAX * AB) | 0);
    let wi = 0;
    while (wi < 4 && width > WEDGE[wi]) wi++;
    const k = (tint * AB + ai) * WB + wi;
    return buckets[k] || (buckets[k] = new Path2D());
  }
  function flushBuckets() {
    ctx.lineCap = 'round';
    for (let k = 0; k < buckets.length; k++) {
      const p = buckets[k];
      if (!p) continue;
      const wi = k % WB, ai = ((k / WB) | 0) % AB, tint = (k / (WB * AB)) | 0;
      ctx.strokeStyle = `rgba(${TINTS[tint]},${((ai + 0.5) / AB * AMAX).toFixed(3)})`;
      ctx.lineWidth = WREP[wi];
      ctx.stroke(p);
    }
    buckets = [];
  }
  // radiance: ambient + nearby lights (1/d², Henyey–Greenstein forward scattering)
  const SKY_E = 1.2, HG_G = 0.55;
  let illumE = 0, illumTint = 0, nearLights = [];
  function illuminate(x, y, z) {
    const vl = Math.hypot(x, y, z) || 1;
    let warm = 0, cool = 0;
    for (const L of nearLights) {
      const dx = x - L.cx, dy = y - L.cy, dz = z - L.cz;
      const d2 = dx * dx + dy * dy + dz * dz, d = Math.sqrt(d2);
      const cos = -(dx * x + dy * y + dz * z) / (d * vl);
      const ph = (1 - HG_G * HG_G) / Math.pow(1 + HG_G * HG_G - 2 * HG_G * cos, 1.5);
      const beam = L.bz ? Math.pow(Math.max(0, (dz * L.bz + dy * L.by) / d), 6) : 1;
      const e = L.I * ph * beam / (d2 + 0.6);
      if (L.warm) warm += e; else cool += e;
    }
    illumE = SKY_E + warm + cool;
    illumTint = cool > SKY_E * 0.8 && cool > warm ? 2 : warm > SKY_E * 0.8 ? 1 : 0;
  }
  function streak(x, y, z, vx, vy, vz, D) {
    const x2 = x - vx * EXPOSURE, y2 = y - vy * EXPOSURE, z2 = z - vz * EXPOSURE;
    if (z < 0.15 || z2 < 0.15) return;
    const s1x = cx + f * x / z, s1y = cy - f * y / z, s2x = cx + f * x2 / z2, s2y = cy - f * y2 / z2;
    if ((s1x < 0 && s2x < 0) || (s1x > W && s2x > W) || (s1y < 0 && s2y < 0) || s2y > H) return;
    const wPhys = f * D * 1e-3 / z, coc = f * APERTURE * Math.abs(1 / z - 1 / focusD);
    const width = Math.max(0.5, wPhys) + coc;
    const speed = Math.max(0.3, Math.hypot(vx, vy, vz));
    illuminate(x, y, z);
    const alpha = 42 * (D * 1e-3 / (speed * EXPOSURE)) * illumE * Math.exp(-z / 14) * Math.min(1, (wPhys * 2 + 0.35) / width);
    const p = bucket(Math.min(AMAX, alpha), width, illumTint);
    if (!p) return;
    p.moveTo(s1x, s1y); p.lineTo(s2x, s2y);
  }
  function prepareLights() {
    nearLights = [];
    for (const L of lights) {
      const cz = L.z - cam.z;
      if (cz < -2 || cz > ZF + 6) continue;
      nearLights.push({ cx: L.x - cam.x, cy: L.y - cam.y, cz, I: L.I, warm: /^255,(1|2)/.test(L.col), bz: L.bz, by: L.by });
    }
  }
  function drawRain() {
    prepareLights();
    const rp = new Path2D();
    for (const r of ripples) {
      const z = r.z - cam.z;
      if (z < 0.5) continue;
      const sx = cx + f * (r.x - cam.x) / z, sy = cy + f * cam.y / z;
      if (sx < -40 || sx > W + 40 || sy > H + 20) continue;
      const rad = 0.004 + 0.23 * r.age, a = r.amp * Math.exp(-2.2 * r.age);
      if (a < 0.08) continue;
      const rx = f * rad / z, ry = rx * cam.y / z;
      rp.moveTo(sx + rx, sy); rp.ellipse(sx, sy, rx, ry, 0, 0, TAU);
    }
    ctx.strokeStyle = 'rgba(175,190,215,0.22)'; ctx.lineWidth = 0.8;
    ctx.stroke(rp);
    for (const s of splashes) streak(s.x, s.y, s.z, s.vx, s.vy, s.vz - state.speed, s.D);
    for (const d of drops) streak(d.x, d.y, d.z, d.vx, -d.v, -state.speed, d.D);
    for (const d of edgeDrips) streak(d.x - cam.x, d.y - cam.y, d.z - cam.z, 0, d.vy, -state.speed, d.D);
    flushBuckets();
  }

  // ---------- the vinyl umbrella ----------
  // A spherical cap (sphere radius 0.8 m, rim radius 0.52 m) held just above the head,
  // tilted a little forward and into the wind. 8 ribs; the vinyl between them sags into
  // scallops, so the rib tips are the lowest points of the rim — where water drains.
  const U = { Rs: 0.8, R: 0.52, apex: [0.04, 0.37, 0.12], tilt: 0.16, roll: 0, ribs: 8, spin: 0.18 };
  U.thR = Math.asin(U.R / U.Rs);
  function rimTheta(phi) {
    const s = Math.abs(Math.sin(U.ribs / 2 * (phi - U.spin) - Math.PI / 2));   // 1 at a rib, 0 between
    return U.thR * (1 - 0.05 * Math.pow(1 - s, 1.5));
  }
  // local canopy point → camera coordinates (y up, z forward)
  const CP = [0, 0, 0];
  function canopyPoint(th, phi) {
    const sT = Math.sin(th);
    let x = U.Rs * sT * Math.sin(phi), y = -U.Rs * (1 - Math.cos(th)), z = U.Rs * sT * Math.cos(phi);
    // pitch forward (tilt) and roll into the wind
    const ct = Math.cos(U.tilt), st = Math.sin(U.tilt);
    let y2 = y * ct - z * st, z2 = y * st + z * ct;
    const cr = Math.cos(U.roll), sr = Math.sin(U.roll);
    const x3 = x * cr - y2 * sr, y3 = x * sr + y2 * cr;
    CP[0] = U.apex[0] + x3; CP[1] = U.apex[1] + y3; CP[2] = U.apex[2] + z2;
    return CP;
  }
  // is a camera-relative point inside the dry shadow under the canopy?
  function underUmbrella(x, y, z) {
    let lx = x - U.apex[0], ly = y - U.apex[1], lz = z - U.apex[2];
    const cr = Math.cos(-U.roll), sr = Math.sin(-U.roll);
    const x1 = lx * cr - ly * sr, y1 = lx * sr + ly * cr;
    const ct = Math.cos(-U.tilt), st = Math.sin(-U.tilt);
    const y2 = y1 * ct - lz * st, z2 = y1 * st + lz * ct;
    const r = Math.hypot(x1, z2);
    if (r > U.R) return false;
    const ys = -(U.Rs - Math.sqrt(U.Rs * U.Rs - r * r));
    return y2 < ys && y2 > ys - 2.2;
  }
  // which side of the canopy a point is on: 1 above the film, −1 below it, 0 outside the disc.
  // A drop is caught only when it actually passes through the film — rain slanting in on the
  // wind can still get under the umbrella.
  function canopySide(x, y, z) {
    const lx = x - U.apex[0], ly = y - U.apex[1], lz = z - U.apex[2];
    const cr = Math.cos(-U.roll), sr = Math.sin(-U.roll);
    const x1 = lx * cr - ly * sr, y1 = lx * sr + ly * cr;
    const ct = Math.cos(-U.tilt), st = Math.sin(-U.tilt);
    const y2 = y1 * ct - lz * st, z2 = y1 * st + lz * ct;
    const r = Math.hypot(x1, z2);
    if (r > U.R) return 0;
    return y2 > -(U.Rs - Math.sqrt(U.Rs * U.Rs - r * r)) ? 1 : -1;
  }

  // drops beaded on the canopy (sampled: each stands for many tiny ones)
  const cdrops = [];
  const HYST = 0.3;                          // PVC film: contact-angle hysteresis
  const A_C = Math.sqrt(3 * SIGMA * HYST / (Math.PI * RHO * G)) * 1000;   // mm
  const tips = Array.from({ length: U.ribs }, (_, k) => ({ phi0: (k + 0.5) * TAU / U.ribs - Math.PI, phi: 0, V: 0, stream: 0 }));
  const TIP_DRIP_V = 0.6 * 2 * Math.PI * 0.004 * SIGMA / (RHO * G);   // Tate's law, 4 mm tip
  const rimDrops = [];
  let impactsVis = [];

  function canopyHit(d) {
    // visible splash flash on the vinyl, and sometimes a bead that stays
    if (impactsVis.length < 60 && Math.random() < 0.5) {
      const p = umbrellaLocal(d.x, d.y, d.z);
      if (p) impactsVis.push({ th: p[0], phi: p[1], age: 0, D: d.D });
    }
  }
  function umbrellaLocal(x, y, z) {
    let lx = x - U.apex[0], ly = y - U.apex[1], lz = z - U.apex[2];
    const cr = Math.cos(-U.roll), sr = Math.sin(-U.roll);
    const x1 = lx * cr - ly * sr, y1 = lx * sr + ly * cr;
    const ct = Math.cos(-U.tilt), st = Math.sin(-U.tilt);
    const z2 = y1 * st + lz * ct;
    const r = Math.hypot(x1, z2);
    if (r > U.R) return null;
    return [Math.asin(r / U.Rs), Math.atan2(x1, z2)];
  }

  // rain lands everywhere, but we only simulate beads on the part of the canopy we can see
  function visibleCanopySpot() {
    for (let k = 0; k < 8; k++) {
      const phi = (Math.random() - 0.5) * 2.6, th = Math.acos(1 - Math.random() * (1 - Math.cos(U.thR)));
      const t = Math.min(th, rimTheta(phi) - 0.01), p = canopyPoint(t, phi);
      if (p[2] < 0.08) continue;
      const sx = cx + f * p[0] / p[2], sy = cy - f * p[1] / p[2];
      if (sx > -10 && sx < W + 10 && sy > -10 && sy < H) return [t, phi];
    }
    return null;
  }
  function makeCDrop(th, phi, V) {
    const d = { th, phi, V, a: 0, moving: false, speed: 0, pin: 0.8 + Math.random() * 0.45, dead: false, fresh: true };
    d.a = Math.cbrt(1.5 * V / Math.PI);
    return d;
  }
  let nextCanopyHit = 0, flutterPhase = 0, cover = 0, arcadeNear = 0, vendNear = 0;
  function seedCanopy() {
    for (let i = 0; i < 260; i++) {
      const spot = visibleCanopySpot();
      if (!spot) continue;
      const D = sampleD(state.rateNow) * (0.8 + Math.random() * 1.2);
      cdrops.push(makeCDrop(spot[0], spot[1], Math.PI / 6 * D ** 3));
    }
  }
  function updateCanopy(dt) {
    // Vortices shed from the rim at f ≈ St·U/D (St ≈ 0.2, D ≈ 1 m) make the canopy flutter,
    // with an amplitude growing like the dynamic pressure ∝ U²
    const u = Math.abs(state.wind);
    flutterPhase += 0.2 * u * dt;
    const flutter = 0.02 * (u / 8) ** 2 * noise1(flutterPhase * 6 + 700);
    U.roll += (clamp(-state.wind * 0.025 - courtesy, -0.4, 0.4) + flutter - U.roll) * Math.min(1, dt * 6);
    U.tilt = 0.16 + 0.6 * flutter;
    const spin = 0.18 + 0.12 * noise1(time * 0.07 + 900);    // the hand slowly turns the shaft
    for (const d of cdrops) d.phi += spin - U.spin;             // beads turn with the fabric
    U.spin = spin;
    for (const t of tips) t.phi = t.phi0 + U.spin;
    // new beads: Poisson arrivals over the visible front half of the canopy
    const lambda = 22 * Math.pow(state.rateNow, 0.75) * (1 - cover);
    nextCanopyHit -= dt;
    while (nextCanopyHit <= 0) {
      const spot = cdrops.length < 500 * quality ? visibleCanopySpot() : null;
      if (spot) {
        const D = sampleD(state.rateNow);
        cdrops.push(makeCDrop(spot[0], spot[1], Math.PI / 6 * D ** 3 * (0.8 + Math.random())));
      }
      nextCanopyHit += -Math.log(1 - Math.random()) / lambda;
    }
    // continuous inflow to the rib tips from all the rain on each panel
    const Qtip = Math.PI * U.R * U.R * state.rateNow * (1 - cover) / 3.6e6 / U.ribs;   // m³/s
    for (const t of tips) t.V += Qtip * dt;

    const ct = Math.cos(U.tilt), st = Math.sin(U.tilt), cr = Math.cos(U.roll), sr = Math.sin(U.roll);
    const Uw = 0.3 * state.wind;
    // Each simulated bead stands for the water on its share of the canopy: it keeps absorbing
    // the countless small drops landing there, dV/dt = R·A_share, until it is heavy enough to run.
    const share = 0.3 / Math.max(40, cdrops.length);                    // m² of visible canopy per bead
    const dV = state.rateNow * (1 - cover) / 3.6e6 * share * 1e9 * dt;  // mm³ this frame
    for (const d of cdrops) {
      d.V += dV * (0.5 + d.pin * 0.5);
      d.a = Math.cbrt(1.5 * d.V / Math.PI);
      // gravity along the curved surface: project g onto the local tangents e_θ, e_φ
      const sT = Math.sin(d.th), cT = Math.cos(d.th), sP = Math.sin(d.phi), cP = Math.cos(d.phi);
      const rot = (x, y, z) => { const y2 = y * ct - z * st; return [x * cr - y2 * sr, x * sr + y2 * cr]; };  // (x', y') after tilt & roll
      const [, eThY] = rot(cT * sP, -sT, cT * cP);
      const [eThX] = rot(cT * sP, -sT, cT * cP);
      const [ePhX, ePhY] = rot(cP, 0, -sP);
      const gTh = -eThY, gPh = -ePhY;                      // g = (0, −1, 0)
      const am = d.a * 1e-3;
      const Fpin = 2 * am * SIGMA * HYST * d.pin * (d.moving ? 0.75 : 1);
      const mg = RHO * (2 / 3) * Math.PI * am ** 3 * G;
      const Fw = 0.5 * 1.2 * Uw * Math.abs(Uw) * Math.PI * am * am;
      const Fth = mg * gTh + Fw * eThX, Fph = mg * gPh + Fw * ePhX;
      const Fm = Math.hypot(Fth, Fph);
      if (Fm > Fpin) {
        d.moving = true;
        const target = Math.min(0.25, 0.003 + SIGMA * HYST / (MU * 60) * (Fm / Fpin - 1));
        d.speed += (target - d.speed) * Math.min(1, dt / 0.06);
        d.th += d.speed * dt * Fth / Fm / U.Rs;
        d.phi += d.speed * dt * Fph / Fm / (U.Rs * Math.max(0.05, sT));
        d.V *= 1 - 0.02 * dt;                               // sheds a thin film as it runs
        d.a = Math.cbrt(1.5 * d.V / Math.PI);
      } else { d.moving = false; d.speed = 0; }
      if (d.th < 0.02) d.th = 0.02;
      if (d.th >= rimTheta(d.phi)) {
        // reached the rim: runs along it to the nearest rib tip
        let best = tips[0], bd = 9;
        for (const t of tips) { const dd = Math.abs(Math.atan2(Math.sin(d.phi - t.phi), Math.cos(d.phi - t.phi))); if (dd < bd) { bd = dd; best = t; } }
        best.V += d.V * 1e-9;
        d.dead = true;
      }
    }
    // merge touching beads (volume conserved)
    for (let i = 0; i < cdrops.length; i++) {
      const a = cdrops[i];
      if (a.dead || !(a.moving || a.fresh)) continue;
      a.fresh = false;
      for (let j = 0; j < cdrops.length; j++) {
        if (i === j) continue;
        const b = cdrops[j];
        if (b.dead) continue;
        const ds = U.Rs * Math.hypot(a.th - b.th, (a.phi - b.phi) * Math.sin(a.th)) * 1000;   // mm
        if (ds < (a.a + b.a) * 0.8) {
          a.V += b.V; a.a = Math.cbrt(1.5 * a.V / Math.PI); b.dead = true;
        }
      }
    }
    for (let i = cdrops.length - 1; i >= 0; i--) if (cdrops[i].dead) cdrops.splice(i, 1);

    // rib tips: a drop leaves when its weight beats surface tension (Tate). At high inflow
    // the dripping becomes a continuous thread that breaks up into drops (Plateau–Rayleigh).
    for (const t of tips) {
      const rate = Qtip / TIP_DRIP_V;
      t.stream += ((rate > 9 ? 1 : 0) - t.stream) * Math.min(1, dt * 2);
      while (t.V >= TIP_DRIP_V) {
        t.V -= TIP_DRIP_V;
        const p = canopyPoint(rimTheta(t.phi), t.phi);
        if (p[2] > 0.05) rimDrops.push({ x: p[0], y: p[1], z: p[2], vy: 0, vx: 0, D: Math.cbrt(6 * TIP_DRIP_V / Math.PI) * 1000, t });
        if (audio) audio.footDrip(Math.sqrt(2 * (p[1] + cam.y) / G), clamp(p[0] * 2, -1, 1));
      }
    }
    for (let i = rimDrops.length - 1; i >= 0; i--) {
      const d = rimDrops[i];
      d.vy -= G * dt; d.y += d.vy * dt; d.z -= state.speed * dt;
      d.x += (state.wind - d.vx) * dt * 0.3;
      if (d.y < -cam.y || d.z < 0.08) rimDrops.splice(i, 1);
    }
    for (let i = impactsVis.length - 1; i >= 0; i--) { impactsVis[i].age += dt; if (impactsVis[i].age > 0.08) impactsVis.splice(i, 1); }
  }

  // screen snapshot used by the beads as lenses (they show the scene upside down)
  let snap = null, snapCtx = null;
  function drawUmbrella() {
    // 1. the vinyl: slightly milky, scatters a little light (reduced contrast through it)
    const rim = [];
    for (let i = 0; i <= 64; i++) {
      const phi = -Math.PI / 2 + Math.PI * i / 64;
      const p = canopyPoint(rimTheta(phi), phi);
      if (p[2] < 0.03) continue;
      rim.push([cx + f * p[0] / p[2], cy - f * p[1] / p[2], p[2]]);
    }
    if (rim.length < 2) return;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-50, -50);
    ctx.lineTo(-50, rim[0][1]);
    for (const [x, y] of rim) ctx.lineTo(x, y);
    ctx.lineTo(W + 50, rim[rim.length - 1][1]);
    ctx.lineTo(W + 50, -50);
    ctx.closePath();
    // Fresnel: the film reflects more at grazing angles, so it looks milkier toward the rim
    const rimTop = Math.min(...rim.map(r => r[1]));
    const fg = ctx.createLinearGradient(0, 0, 0, Math.max(...rim.map(r => r[1])));
    fg.addColorStop(0, 'rgba(205,215,230,0.05)');
    fg.addColorStop(Math.max(0.05, rimTop / H), 'rgba(205,215,230,0.08)');
    fg.addColorStop(1, 'rgba(215,222,235,0.16)');
    ctx.fillStyle = fg;
    ctx.fill();
    if (flashLevel > 0.01) {                         // the milky film scatters the flash
      ctx.fillStyle = `rgba(225,230,255,${Math.min(0.35, flashLevel * 0.3).toFixed(3)})`;
      ctx.fill();
    }
    ctx.clip();
    // light from the street lamps and shops glowing in the film
    for (const L of nearLights) {
      if (L.cz < 0.5 || L.cz > 20) continue;
      const sx = cx + f * L.cx / L.cz, sy = cy - f * L.cy / L.cz;
      const r = 90 + 400 / L.cz;
      const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
      gr.addColorStop(0, `rgba(230,230,240,${Math.min(0.12, L.I / L.cz / 30).toFixed(3)})`); gr.addColorStop(1, 'rgba(230,230,240,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
    }
    // 2. beads on the vinyl — out of focus (we look at the street), each a tiny lens
    const coc = (z) => f * APERTURE * Math.abs(1 / z - 1 / focusD);
    for (const d of cdrops) {
      const p = canopyPoint(d.th, d.phi);
      if (p[2] < 0.05) continue;
      const sx = cx + f * p[0] / p[2], sy = cy - f * p[1] / p[2];
      if (sx < -20 || sx > W + 20 || sy < -20 || sy > H) continue;
      const r = f * d.a * 1e-3 / p[2], b = coc(p[2]);
      const R = r + b * 0.5;
      if (b < 1.5 && r > 1.2 && snapC.width > 1) {
        // in focus: a sessile drop is a small ball lens — the scene appears inverted inside it,
        // with a dark rim (total internal reflection) and a bright specular point
        const k = snapC.width / W, S = r * 2 * 7;
        ctx.save();
        ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.clip();
        ctx.translate(sx, sy); ctx.scale(-1, -1);
        ctx.drawImage(snapC, clamp((sx - S / 2) * k, 0, snapC.width - S * k), clamp((sy - S / 2) * k, 0, snapC.height - S * k), S * k, S * k, -r, -r, r * 2, r * 2);
        ctx.restore();
        // light gathered by the lens brightens it; the rim goes dark; the lower edge catches
        // a caustic from the lights below; a sharp specular glint on top
        const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
        rg.addColorStop(0, 'rgba(210,220,240,0.18)'); rg.addColorStop(0.6, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(5,8,14,0.5)');
        ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
        ctx.strokeStyle = 'rgba(255,230,200,0.35)'; ctx.lineWidth = Math.max(0.5, r * 0.18);
        ctx.beginPath(); ctx.arc(sx, sy, r * 0.8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath(); ctx.arc(sx - r * 0.3, sy - r * 0.35, Math.max(0.6, r * 0.2), 0, TAU); ctx.fill();
        continue;
      }
      const gr = ctx.createRadialGradient(sx, sy - r * 0.3, 0, sx, sy, R);
      gr.addColorStop(0, `rgba(240,244,255,${(0.6 / (1 + b * 0.1)).toFixed(3)})`);
      gr.addColorStop(0.45, `rgba(170,185,210,${(0.28 / (1 + b * 0.1)).toFixed(3)})`);
      gr.addColorStop(0.85, `rgba(10,12,18,${(0.25 / (1 + b * 0.1)).toFixed(3)})`);
      gr.addColorStop(1, 'rgba(10,12,18,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(sx, sy, R, 0, TAU); ctx.fill();
    }
    // splashes on the film: tiny bright crowns, gone in a few frames
    ctx.fillStyle = 'rgba(230,236,250,0.35)';
    for (const s of impactsVis) {
      const p = canopyPoint(s.th, s.phi);
      if (p[2] < 0.05) continue;
      const sx = cx + f * p[0] / p[2], sy = cy - f * p[1] / p[2];
      const r = (2 + s.D) * (1 + s.age * 30) * 0.6;
      ctx.globalAlpha = 1 - s.age / 0.08;
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // 3. ribs: meridians from the rib tips up toward the crown (thin steel, out of focus)
    ctx.lineCap = 'round';
    for (const t of tips) {
      if (Math.abs(Math.atan2(Math.sin(t.phi), Math.cos(t.phi))) > Math.PI / 2) continue;
      ctx.beginPath();
      let started = false, zt = 1;
      for (let i = 0; i <= 20; i++) {
        const th = rimTheta(t.phi) * (1 - i / 20);
        const p = canopyPoint(th, t.phi);
        if (p[2] < 0.04) break;
        const sx = cx + f * p[0] / p[2], sy = cy - f * p[1] / p[2];
        if (!started) { ctx.moveTo(sx, sy); started = true; zt = p[2]; } else ctx.lineTo(sx, sy);
      }
      // thin steel: a dark core with a faint sheen from the street lights below
      ctx.strokeStyle = 'rgba(150,158,172,0.22)';
      ctx.lineWidth = f * 0.004 / zt + coc(zt) * 0.9;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(12,14,18,0.6)';
      ctx.lineWidth = f * 0.0025 / zt + coc(zt) * 0.3;
      ctx.stroke();
    }
    // 4. the rim: the film seen edge-on catches light; black tips at the rib ends
    ctx.beginPath();
    rim.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.strokeStyle = 'rgba(220,228,240,0.28)';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    for (const t of tips) {
      const p = canopyPoint(rimTheta(t.phi), t.phi);
      if (p[2] < 0.05) continue;
      const sx = cx + f * p[0] / p[2], sy = cy - f * p[1] / p[2];
      ctx.fillStyle = 'rgba(15,15,18,0.85)';
      ctx.beginPath(); ctx.arc(sx, sy + 2, Math.max(2, f * 0.005 / p[2]) + coc(p[2]) * 0.3, 0, TAU); ctx.fill();
      // streaming tips: a continuous water thread before it breaks into drops
      if (t.stream > 0.05) {
        // the thread falls ~Lb before breaking up; drag bends it downwind (Δx ≈ ½·(ρ_a/ρ_w)·… ≈ U·t·0.3)
        const Lb = 0.12 + 0.2 * t.stream, tf = Math.sqrt(2 * Lb / G);
        const q = [p[0] + state.wind * tf * 0.3, p[1] - Lb, p[2]];
        ctx.strokeStyle = `rgba(210,220,240,${(0.25 * t.stream).toFixed(3)})`;
        ctx.lineWidth = 1.5 + coc(p[2]) * 0.4;
        ctx.beginPath(); ctx.moveTo(sx, sy + 2); ctx.lineTo(cx + f * q[0] / q[2], cy - f * q[1] / q[2]); ctx.stroke();
      }
    }
    // 5. drops falling from the rib tips right in front of our face: big, blurred streaks
    for (const d of rimDrops) {
      if (d.z < 0.08) continue;
      const sx = cx + f * d.x / d.z, sy = cy - f * d.y / d.z;
      const sy2 = cy - f * (d.y - d.vy * EXPOSURE) / d.z;
      const w = f * d.D * 1e-3 / d.z, b = coc(d.z);
      ctx.strokeStyle = `rgba(215,225,245,${(0.3 / (1 + b * 0.25)).toFixed(3)})`;
      ctx.lineWidth = w + b;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, Math.min(sy - 1, sy2)); ctx.stroke();
    }
    // 6. the shaft, held in the right hand
    const top = [U.apex[0], U.apex[1], U.apex[2]], hand = [0.13, -0.32, 0.24];
    const pa = [cx + f * top[0] / Math.max(0.05, top[2]), cy - f * top[1] / Math.max(0.05, top[2])];
    const pb = [cx + f * hand[0] / hand[2], cy - f * hand[1] / hand[2]];
    ctx.strokeStyle = 'rgba(225,228,235,0.18)';
    ctx.lineWidth = f * 0.012 / 0.2 + coc(0.2);
    ctx.beginPath(); ctx.moveTo(pa[0], pa[1]); ctx.lineTo(pb[0], pb[1]); ctx.stroke();
  }

  // A cloud-to-ground discharge as a tortuous 3D channel (mean direction change ≈ 16° per
  // segment, Hill 1968) with branches and a horizontal in-cloud part. The same geometry is
  // drawn on screen and used to synthesise the thunder, so what you see is what you hear.
  function makeChannel(d, az, intraCloud = false) {
    const h = 1500 + Math.random() * 1500;                  // cloud base height (m)
    const gx = d * Math.sin(az), gz = d * Math.cos(az);
    const segs = [];                                        // [x1,y1,z1,x2,y2,z2,depth]
    function walk(x, y, z, dx, dy, dz, depth, stopY) {
      while (y > stopY) {
        const len = 15 + Math.random() * 45;
        // pull toward the strike point, randomised by ~16° tortuosity
        const tx = gx - x, tz = gz - z, ty = -EYE - y, tl = Math.hypot(tx, ty, tz) || 1;
        dx = dx * 0.55 + tx / tl * 0.45 + (Math.random() - 0.5) * 0.55;
        dy = dy * 0.55 + ty / tl * 0.45 + (Math.random() - 0.5) * 0.3;
        dz = dz * 0.55 + tz / tl * 0.45 + (Math.random() - 0.5) * 0.55;
        const m = Math.hypot(dx, dy, dz); dx /= m; dy /= m; dz /= m;
        const nx = x + dx * len, ny = Math.max(stopY, y + dy * len), nz = z + dz * len;
        segs.push([x, y, z, nx, ny, nz, depth]);
        x = nx; y = ny; z = nz;
        if (depth < 2 && Math.random() < 0.06) {
          walk(x, y, z, dx + (Math.random() - 0.5) * 1.5, dy, dz + (Math.random() - 0.5) * 1.5, depth + 1, y - (y + EYE) * (0.2 + Math.random() * 0.4));
        }
      }
    }
    const top = [gx + (Math.random() - 0.5) * 800, h, gz + (Math.random() - 0.5) * 800];
    if (!intraCloud) walk(top[0], top[1], top[2], 0, -1, 0, 0, -EYE);
    // in-cloud horizontal channel: invisible, but responsible for the long rolling rumble
    let x = top[0], z = top[2], hx = Math.random() - 0.5, hz = Math.random() - 0.5;
    const L = intraCloud ? 3000 + Math.random() * 5000 : 1000 + Math.random() * 3000;
    for (let s = 0; s < L; s += 50) {
      hx += (Math.random() - 0.5) * 0.6; hz += (Math.random() - 0.5) * 0.6;
      const m = Math.hypot(hx, hz) || 1;
      const nx = x + hx / m * 50, nz = z + hz / m * 50;
      segs.push([x, h + 200, z, nx, h + 200 + (Math.random() - 0.5) * 60, nz, 9]);
      x = nx; z = nz;
    }
    return segs;
  }

  // ---------- lightning ----------
  const flashes = [];
  let flashLevel = 0, flashPeak = 1, flashX = 0, bolt = null, thunderInfo = null, nextAutoBolt = 12;
  function lightning() {
    const d = 400 + Math.pow(Math.random(), 1.6) * 9000;
    // looking down a street the sky is a narrow strip, so aim the channel into it
    const az = (Math.random() - 0.5) * 0.35;
    const ic = Math.random() < 0.6;                  // ~¾ of flashes stay inside the cloud
    const peak = (ic ? 0.35 : 1) * (0.2 + 0.8 * Math.min(1, 1500 / d));
    flashPeak = peak;
    let t = 0;
    const strokes = ic ? 3 + (Math.random() * 5 | 0) : 1 + (Math.random() * 4 | 0);
    for (let i = 0; i < strokes; i++) {
      flashes.push({ delay: t, peak: peak * (i ? 0.45 + Math.random() * 0.5 : 1), age: 0, tau: ic ? 0.12 : 0.06 });
      t += ic ? 0.08 + Math.random() * 0.25 : 0.04 + Math.random() * 0.12;
    }
    const channel = makeChannel(d, az, ic);
    flashX = cx + f * Math.tan(az);
    bolt = !ic && d < 8000 ? { segs: channel.filter(sg => sg[6] <= 2), w: clamp(f * 6 / d, 0.8, 3.5) } : null;
    if (audio) audio.thunder(channel);
    let rmin = Infinity;
    for (const sg of channel) rmin = Math.min(rmin, Math.hypot(sg[0], sg[1], sg[2]), Math.hypot(sg[3], sg[4], sg[5]));
    thunderInfo = { d, rmin, ic, t0: performance.now() };
    if (navigator.vibrate) navigator.vibrate(30);
  }
  function updateFlash(dt) {
    if (state.rateNow > 25) {
      nextAutoBolt -= dt;
      if (nextAutoBolt <= 0) { lightning(); nextAutoBolt = 5 + Math.random() * 20 * (60 / state.rateNow); }
    }
    flashLevel = 0;
    for (let i = flashes.length - 1; i >= 0; i--) {
      const fl = flashes[i];
      fl.age += dt;
      const t = fl.age - fl.delay;
      if (t >= 0) flashLevel += fl.peak * Math.exp(-t / fl.tau);
      if (t > 10 * fl.tau) flashes.splice(i, 1);
    }
    if (!flashes.length) bolt = null;
  }
  function drawBolt() {
    if (!bolt || flashLevel < 0.02) return;
    const a = Math.min(1, flashLevel / flashPeak * 1.2);
    const paths = [new Path2D(), new Path2D(), new Path2D()];
    for (const [x1, y1, z1, x2, y2, z2, depth] of bolt.segs) {
      if (z1 < 50 || z2 < 50) continue;
      paths[depth].moveTo(cx + f * x1 / z1, cy - f * (y1 - (cam.y - EYE)) / z1);
      paths[depth].lineTo(cx + f * x2 / z2, cy - f * (y2 - (cam.y - EYE)) / z2);
    }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(170,190,255,0.9)';
    const defocus = focusNear ? 4 : 1;
    ctx.shadowBlur = 18 * defocus;
    paths.forEach((p, depth) => {
      ctx.strokeStyle = `rgba(240,244,255,${a * (1 - depth * 0.2) / Math.sqrt(defocus)})`;
      ctx.lineWidth = bolt.w * Math.pow(0.5, depth) * defocus;
      ctx.stroke(p);
    });
    ctx.restore();
  }
  // in the flash the rain appears frozen: bright short dashes (a stroke lasts < 1 ms)
  function drawFrozenRain() {
    const a = Math.min(0.9, flashLevel * 0.9);
    const p = new Path2D();
    for (const d of drops) {
      if (d.z > 12) continue;
      const sx = cx + f * d.x / d.z, sy = cy - f * d.y / d.z;
      if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
      p.moveTo(sx, sy); p.lineTo(sx, sy - Math.max(1.2, f * d.v * 0.004 / d.z));
    }
    ctx.lineCap = 'round'; ctx.lineWidth = 1.2;
    ctx.strokeStyle = `rgba(225,232,255,${a.toFixed(3)})`;
    ctx.stroke(p);
  }

  // ---------- audio ----------
  let audio = null;
  // the context is created inside the tap (iOS only unlocks audio there); the heavy
  // synthesis runs a frame later so the page can show that it is preparing
  function createAudio(ac) {
    if (!ac) return null;

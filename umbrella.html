      lp.connect(out);
      [[1319, 0], [1047, 0.42]].forEach(([f0, dt0]) => {
        [[1, 1, 1.2], [2.76, 0.35, 0.45], [5.4, 0.15, 0.2]].forEach(([m, a, dec]) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.frequency.value = f0 * m;
          g.gain.setValueAtTime(0.0001, t + dt0); g.gain.exponentialRampToValueAtTime(amp * a, t + dt0 + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dt0 + dec);
          o.connect(g).connect(lp); o.start(t + dt0); o.stop(t + dt0 + dec + 0.05);
        });
      });
    }
    return { ac, master, update, step, footDrip, carVoice, otherStep, signal, thunder, chime };
  }

  // ---------- loop ----------
  let last = performance.now(), time = 0, audioT = 0, statsT = 0, stepSide = 1, lastStepPhase = 0;
  let quality = 1, ftAvg = 16.7, ftBase = 1000, qualityT = 0;
  function adaptQuality(ms) {
    if (ms <= 0 || ms > 250) return;
    ftAvg += (ms - ftAvg) * 0.08;
    ftBase = Math.min(17.5, ftBase * 1.0005, ftAvg);
    qualityT += ms / 1000;
    if (qualityT < 1) return;
    qualityT = 0;
    if (ftAvg > ftBase * 1.22 && quality > 0.35) quality *= 0.85;
    else if (ftAvg < ftBase * 1.08 && quality < 1) quality = Math.min(1, quality * 1.04);
    // last resort: fewer pixels (GPU fill rate), restored once there is headroom again
    const want = quality < 0.5 ? 0.7 : quality > 0.9 ? 1 : renderScale;
    if (want !== renderScale) { renderScale = want; sizeCanvas(); }
  }
  let renderScale = 1;
  function sizeCanvas() {
    DPR = Math.min(window.devicePixelRatio || 1, 2) * renderScale;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  }
  function gustField(x, t) {
    const X = x - state.wind0 * t;
    return 0.6 * noise1(X / 28 + t * 0.05) + 0.3 * noise1(X / 9 + 100 + t * 0.15) + 0.15 * noise1(X / 3.5 + 200 + t * 0.4);
  }

  function frame(now) {
    adaptQuality(now - last);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; time += dt;
    state.wind = state.wind0 + (0.35 * Math.abs(state.wind0) + 0.5) * gustField(0, time);
    state.rateNow = state.rate * Math.exp(0.28 * pink1(time * 0.05, 500));

    camYPrev = cam.y;
    updateCamera(dt);
    // footstep at each heel strike (lowest point of the gait)
    const stepPhase = Math.floor(cam.phase / TAU);
    if (stepPhase !== lastStepPhase) {
      lastStepPhase = stepPhase; stepSide = -stepSide;
      if (audio && state.speed > 0.4) {
        const wet = inPuddle(cam.x + stepSide * 0.1, cam.z + 0.3);
        audio.step(stepSide, wet);
        if (wet) ripples.push({ x: cam.x + stepSide * 0.1, z: cam.z + 0.3, age: 0, amp: 1.5 });
      }
    }
    updateRain(dt);
    updateCanopy(dt);
    updateCars(dt);
    updatePeds(dt);
    updateSignalSound(dt);
    updateFlash(dt);
    updateArcadeEdge(dt);
    cover += ((inArcade(cam.x, cam.z + 0.1) ? 1 : 0) - cover) * Math.min(1, dt / 0.15);
    let an = 0;
    for (const blk of blocks.values()) if (blk.arcade) {
      const dz = Math.max(blk.z0 - cam.z, cam.z - blk.z1, 0);
      an = Math.max(an, Math.exp(-dz / 6));
    }
    arcadeNear = an;
    // customers going in and out of a convenience store trigger its entry chime
    for (const blk of blocks.values()) for (const b of blk.right) {
      if (!b.shop || !b.shop.konbini) continue;
      const dz = (b.z0 + b.z1) / 2 - cam.z;
      if (Math.abs(dz) < 12 && Math.random() < dt * 0.12 && audio) audio.chime(clamp(SIDE_R / Math.hypot(SIDE_R, dz), -1, 1), Math.hypot(SIDE_R, dz));
    }
    let vn = 0;
    for (const blk of blocks.values()) if (blk.vend) {
      const r = Math.hypot(SIDE_R - 0.75 - cam.x, blk.vend.z + 0.5 - cam.z);
      vn = Math.max(vn, 1 / (1 + (r / 1.5) ** 2));
    }
    vendNear = vn;
    if (audio) { audioT += dt; if (audioT > 0.1) { audio.update(); audioT = 0; } }

    const kf = Math.min(1, dt / 0.35);
    focusD = Math.exp(Math.log(focusD) + (Math.log(focusNear ? 0.55 : 9) - Math.log(focusD)) * kf);
    pitch += ((focusNear ? 0.22 : 0) - pitch) * Math.min(1, dt / 0.6);
    cy = cy0 + f * Math.tan(pitch);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawSky();
    drawGround();
    drawCity();
    drawReflections();
    drawPuddles(visibleBlocks());
    // rain scatters light: the street fades into haze
    ctx.fillStyle = `rgba(55,60,75,${(0.25 * (1 - Math.exp(-state.rateNow / 40))).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    blurScene();
    drawRain();
    if (flashLevel > 0.08) drawFrozenRain();
    takeSnapshot();
    drawUmbrella();
    if (quality > 0.5) veilingGlare();
    if (flashLevel > 0.005) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const fl = Math.min(1.2, flashLevel);
      ctx.fillStyle = `rgba(150,160,210,${(fl * 0.12).toFixed(3)})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    ctx.drawImage(vignette, 0, 0, W, H);

    statsT += dt;
    if (statsT > 0.25) { updateStats(); statsT = 0; }
    requestAnimationFrame(frame);
  }

  // defocus of the whole street when the eye accommodates to the umbrella: circle of
  // confusion b = f·A·|1/z − 1/z_f| for z ≈ 12 m, approximated by down/up-sampling
  // (two resampling stages each way, so the bilinear filter approximates a smooth kernel)
  const blurC = document.createElement('canvas'), blurX = blurC.getContext('2d');
  const midC = document.createElement('canvas'), midX = midC.getContext('2d');
  function blurScene() {
    const b = f * APERTURE * Math.abs(1 / 12 - 1 / focusD);
    if (b < 1.2) return;
    const sc = clamp(1.6 / b, 0.05, 1), sm = Math.min(1, sc * 2.2);
    const w = Math.max(1, Math.round(canvas.width * sc)), h = Math.max(1, Math.round(canvas.height * sc));
    const mw = Math.max(1, Math.round(canvas.width * sm)), mh = Math.max(1, Math.round(canvas.height * sm));
    if (blurC.width !== w || blurC.height !== h) { blurC.width = w; blurC.height = h; }
    if (midC.width !== mw || midC.height !== mh) { midC.width = mw; midC.height = mh; }
    midX.drawImage(canvas, 0, 0, mw, mh);
    blurX.drawImage(midC, 0, 0, w, h);
    midX.drawImage(blurC, 0, 0, mw, mh);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(midC, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
  // Veiling glare: light scattered inside the eye (and by the wet air) spreads around every
  // bright source, falling off roughly as 1/θ² (Stiles–Holladay). A wide blurred copy of the
  // scene added back with 'screen' gives the halos of a rainy night without lifting the blacks.
  const glC1 = document.createElement('canvas'), glX1 = glC1.getContext('2d');
  const glC2 = document.createElement('canvas'), glX2 = glC2.getContext('2d');
  function veilingGlare() {
    const w1 = Math.max(1, canvas.width >> 3), h1 = Math.max(1, canvas.height >> 3);
    const w2 = Math.max(1, canvas.width >> 5), h2 = Math.max(1, canvas.height >> 5);
    if (glC1.width !== w1 || glC1.height !== h1) { glC1.width = w1; glC1.height = h1; }
    if (glC2.width !== w2 || glC2.height !== h2) { glC2.width = w2; glC2.height = h2; }
    glX1.drawImage(canvas, 0, 0, w1, h1);
    glX2.drawImage(glC1, 0, 0, w2, h2);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.1 + 0.08 * (1 - Math.exp(-state.rateNow / 30));   // wetter air → more halo
    ctx.drawImage(glC1, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.14;
    ctx.drawImage(glC2, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
  // a half-resolution copy of the scene for the beads to refract
  const snapC = document.createElement('canvas'), snapX = snapC.getContext('2d');
  function takeSnapshot() {
    if (focusD > 2) return;
    const w = canvas.width >> 1, h = canvas.height >> 1;
    if (snapC.width !== w || snapC.height !== h) { snapC.width = w; snapC.height = h; }
    snapX.drawImage(canvas, 0, 0, w, h);
  }

  let vignette, cy0 = 0;
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    sizeCanvas();
    f = 0.62 * Math.hypot(W, H);
    cx = W / 2; cy0 = cy = H * 0.56;
    vignette = mkCanvas(W, H);
    const v = vignette.getContext('2d');
    const gr = v.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.hypot(W, H) * 0.62);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.42)');
    v.fillStyle = gr; v.fillRect(0, 0, W, H);
    drops.length = 0;
    paintSkyLit();
  }
  window.addEventListener('resize', resize);
  resize();

  const statsEl = document.getElementById('stats');
  function updateStats() {
    const R = state.rateNow, L = mpLambda(R), meanD = 0.5 + 1 / L;
    const tipRate = Math.PI * U.R * U.R * R / 3.6e6 / U.ribs / TIP_DRIP_V;
    statsEl.innerHTML =
      `降水強度 ${R.toFixed(1)} mm/h（${rainClass(R)}）・風速 ${state.wind.toFixed(1)} m/s<br>` +
      `平均雨滴径 ${meanD.toFixed(2)} mm・傘の骨の先から ${tipRate < 9 ? tipRate.toFixed(1) + ' 滴/秒' : '水が糸状に流れ落ちる'}<br>` +
      `歩いた距離 ${cam.z.toFixed(0)} m`;
    if (thunderInfo) {
      const hud = document.getElementById('hud');
      const el = (performance.now() - thunderInfo.t0) / 1000, eta = thunderInfo.rmin / SOUND_SPEED;
      const km = ((thunderInfo.ic ? thunderInfo.rmin : thunderInfo.d) / 1000).toFixed(1);
      const what = thunderInfo.ic ? '☁ 雲の中で放電' : '⚡ 落雷';
      if (el < eta) hud.textContent = `${what} ${km} km — 雷鳴まで ${(eta - el).toFixed(1)} 秒`;
      else if (el < eta + 6) hud.textContent = `${what} ${km} km — ゴロゴロ…`;
      else thunderInfo = null;
      hud.style.opacity = thunderInfo ? 1 : 0;
    }
  }
  seedCanopy();
  for (let i = 0; i < 6; i++) spawnPed(true);
  requestAnimationFrame(frame);
  if (location.hash === '#debug') window.__umb = { state, cam, cdrops, tips, cars, spawnCar, blocks, lightning, get audio() { return audio; } };

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  function bindSlider(id, apply, fmt) {
    const el = $(id), val = $(id + 'Val');
    const sync = () => { apply(+el.value); val.textContent = fmt(); if (audio) audio.update(); };
    el.addEventListener('input', sync); sync();
    return el;
  }
  bindSlider('rate', v => state.rate = rateFromSlider(v), () => `${state.rate.toFixed(1)} mm/h`);
  const windSlider = bindSlider('wind', v => state.wind0 = v / 10, () => `${state.wind0.toFixed(1)} m/s`);
  bindSlider('volume', v => state.volume = v / 100, () => `${Math.round(state.volume * 100)}%`);
  function setWind(v) {
    state.wind0 = clamp(v, -15, 15);
    windSlider.value = Math.round(state.wind0 * 10);
    $('windVal').textContent = `${state.wind0.toFixed(1)} m/s`;
  }
  function setWalking(w) {
    state.walking = w;
    $('walkBtn').classList.toggle('on', w);
    $('walkBtn').textContent = w ? '歩く' : '立ち止まる';
  }
  $('startBtn').addEventListener('click', e => {
    const AC = window.AudioContext || window.webkitAudioContext;
    const ac = AC ? new AC() : null;
    if (ac && ac.state === 'suspended') ac.resume();
    e.currentTarget.disabled = true;
    e.currentTarget.textContent = '雨音を準備中…';
    setTimeout(() => { audio = createAudio(ac); $('start').remove(); }, 60);
  });
  $('toggle').addEventListener('click', () => $('panel').classList.toggle('hidden'));
  $('walkBtn').addEventListener('click', () => setWalking(!state.walking));
  $('thunderBtn').addEventListener('click', () => lightning());
  $('focusBtn').addEventListener('click', e => {
    focusNear = !focusNear;
    e.currentTarget.textContent = focusNear ? 'ピント: 傘' : 'ピント: 街';
    e.currentTarget.classList.toggle('on', focusNear);
  });
  $('windowBtn').addEventListener('click', () => { location.href = 'index.html'; });

  let touchStart = null;
  canvas.addEventListener('pointerdown', e => { touchStart = { x: e.clientX, wind: state.wind0, moved: false }; });
  canvas.addEventListener('pointermove', e => {
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x;
    if (Math.abs(dx) > 10) touchStart.moved = true;
    if (touchStart.moved) setWind(touchStart.wind + dx / (W * 0.6) * 15);
  });
  canvas.addEventListener('pointerup', () => { if (touchStart && !touchStart.moved) setWalking(!state.walking); touchStart = null; });
  canvas.addEventListener('pointercancel', () => touchStart = null);
  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.ac.suspend(); else audio.ac.resume();
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rain">
<meta name="theme-color" content="#05070c">
<title>Rain Simulator</title>
<style>
  :root {
    --panel: rgba(12, 18, 32, 0.74);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #7dd3fc;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05070c; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #start {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(5, 7, 12, 0.55); backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px); z-index: 10; text-align: center; padding: 24px;
  }
  #start h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
  #start p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  button {
    font: inherit; color: var(--text); background: rgba(125, 211, 252, 0.15);
    border: 1px solid rgba(125, 211, 252, 0.4); border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
  }
  button:active { background: rgba(125, 211, 252, 0.3); }
  #startBtn { font-size: 17px; padding: 14px 32px; }
  #panel {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    background: var(--panel); border-radius: 18px; padding: 14px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: grid; gap: 10px; z-index: 5; transition: transform .3s, opacity .3s;
    max-width: 480px; margin: 0 auto;
  }
  #panel.hidden { transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }
  .row { display: grid; grid-template-columns: 44px 1fr 78px; align-items: center; gap: 10px; font-size: 13px; }
  .row span:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); touch-action: pan-x; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .buttons button { flex: 1; font-size: 13px; padding: 8px 10px; }
  button.on { background: rgba(125, 211, 252, 0.35); }
  #stats { font-size: 11.5px; color: var(--muted); line-height: 1.6; font-variant-numeric: tabular-nums; }
  #toggle {
    position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top));
    z-index: 6; padding: 8px 14px; font-size: 13px; background: var(--panel);
  }
  #hud {
    position: fixed; left: 14px; top: calc(18px + env(safe-area-inset-top));
    z-index: 6; font-size: 13px; color: var(--text); text-shadow: 0 1px 4px #000;
    font-variant-numeric: tabular-nums; pointer-events: none;
    transition: opacity .6s; opacity: 0;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <h1>☔ Rain Simulator</h1>
  <p>雨滴の粒径分布・終端速度・表面張力・音速にもとづく雨<br>
     タップで落雷 ⚡ / 左右スワイプで風<br>
     「傾き」をオンにすると、窓の水滴が本当の重力方向へ流れます</p>
  <button id="startBtn">はじめる（音あり）</button>
</div>

<div id="hud"></div>
<button id="toggle">設定</button>

<div id="panel" class="hidden">
  <div class="row"><span>雨量</span><input id="rate" type="range" min="0" max="100" value="55"><span id="rateVal"></span></div>
  <div class="row"><span>風</span><input id="wind" type="range" min="-150" max="150" value="20"><span id="windVal"></span></div>
  <div class="row"><span>音量</span><input id="volume" type="range" min="0" max="100" value="60"><span id="volumeVal"></span></div>
  <div class="buttons">
    <button id="glassBtn" class="on">窓ガラス</button>
    <button id="tiltBtn">傾き</button>
    <button id="thunderBtn">雷</button>
    <button id="timerBtn">タイマー</button>
  </div>
  <div id="stats"></div>
</div>

<script>
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const G = 9.81;                 // m/s²
  const SOUND_SPEED = 343;        // m/s
  const HC = 3.0;                 // camera height above the street (m) — a 2nd-floor window
  const ZN = 0.5, ZF = 24;        // depth range of the simulated rain volume (m)
  const EXPOSURE = 0.03;          // s — motion-blur time of the eye/camera
  const APERTURE = 0.004;         // m — lens/pupil diameter (depth-of-field blur)
  const PX_PER_MM = 6.3;          // scale of the window glass (≈ true size on an iPhone screen)
  // Furmidge: a drop slides when ρ·V·g > 2a·σ·(cosθr − cosθa). With V = ⅔πa³ the critical
  // contact radius is a_c = √(3σΔ / πρg); Δ = 0.36 is typical contact-angle hysteresis on window glass
  const HYST = 0.36;
  const A_C = Math.sqrt(3 * 0.072 * HYST / (Math.PI * 1000 * 9.81)) * 1000;   // ≈ 1.6 mm
  const LENS = 6;                 // field of view magnification of a drop acting as a ball lens
  const PC = 6;                   // px — cell size of the glass pinning grid

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const trail = document.createElement('canvas');
  const tctx = trail.getContext('2d');

  let W = 0, H = 0, DPR = 1, B = 0, ox = 0, oy = 0, f = 1, cx = 0, cy = 0;

  const state = {
    rate: 7,          // mean rain rate R (mm/h) chosen by the user
    rateNow: 7,       // instantaneous rain rate with natural 1/f fluctuation
    wind0: 2,         // mean wind (m/s, + = to the right)
    wind: 2,          // wind including gusts
    volume: 0.6,
    glass: true,
    tilt: false,
    gx: 0, gy: 1,     // unit gravity direction in screen coords (y down)
    gip: 1,           // fraction of gravity lying in the glass plane
    theta: 0,         // world rotation so rain falls along true gravity
    timerEnd: 0,      // sleep timer (performance.now() ms), 0 = off
    fade: 1,          // sleep-timer fade gain
  };

  // ---------- Rain physics ----------
  // Terminal velocity of a raindrop, Atlas et al. (1973). D in mm → m/s
  const termVel = D => Math.max(0.1, 9.65 - 10.3 * Math.exp(-0.6 * D));
  // Marshall–Palmer drop size distribution N(D) = N0·exp(−ΛD), Λ = 4.1·R^−0.21 mm⁻¹
  const mpLambda = R => 4.1 * Math.pow(Math.max(R, 0.05), -0.21);
  function sampleD(R, dmin = 0.5, dmax = 6) {
    const L = mpLambda(R);
    return dmin - Math.log(1 - Math.random() * (1 - Math.exp(-L * (dmax - dmin)))) / L;
  }
  // number of visible drops (D > 0.5 mm) per m³, N0 = 8000 m⁻³mm⁻¹
  const visibleDensity = R => { const L = mpLambda(R); return 8000 / L * Math.exp(-0.5 * L); };
  const rateFromSlider = s => 0.3 * Math.pow(100 / 0.3, s / 100);   // 0.3 … 100 mm/h, logarithmic
  const rainClass = R => R < 1 ? '小雨' : R < 10 ? '雨' : R < 20 ? 'やや強い雨' : R < 30 ? '強い雨'
    : R < 50 ? '激しい雨' : R < 80 ? '非常に激しい雨' : '猛烈な雨';

  const mkCanvas = (w, h) => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    return c;
  };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // smooth 1D value noise in [-1, 1]
  const NOISE_N = 512, noiseTab = new Float32Array(NOISE_N).map(() => Math.random() * 2 - 1);
  function noise1(x) {
    const i = Math.floor(x), t = x - i, u = t * t * (3 - 2 * t);
    const a = noiseTab[i & (NOISE_N - 1)], b = noiseTab[(i + 1) & (NOISE_N - 1)];
    return a + (b - a) * u;
  }
  // 1/f ("pink") fluctuation: octaves with amplitude ∝ 1/√f, as found in natural rain and wind
  function pink1(t, seed) {
    let v = 0, norm = 0;
    for (let o = 0; o < 6; o++) {
      const fr = Math.pow(2, o), w = 1 / Math.sqrt(fr);
      v += w * noise1(t * fr + seed + o * 37.1); norm += w;
    }
    return v / norm * 1.8;
  }
  // Taylor's frozen turbulence: a gust pattern is carried downstream at the mean wind speed,
  // so neighbouring drops feel coherent gusts that sweep across the scene
  function gustField(x, z, t) {
    const X = x - state.wind0 * t + z * 0.6;
    return 0.6 * noise1(X / 28 + t * 0.05) + 0.3 * noise1(X / 9 + 100 + t * 0.15) + 0.15 * noise1(X / 3.5 + 200 + t * 0.4);
  }

  // ---------- Background (night street seen from a window) ----------
  let bgSharp, bgFlip, layers, rainLights = [], puddles = [];

  function paintBackground() {
    const bs = Math.min(DPR, 1.5);
    const layer = () => { const c = mkCanvas(B * bs, B * bs), x = c.getContext('2d'); x.scale(bs, bs); return [c, x]; };
    // layers: sky (behind the lightning channel), the sky lit from inside by a flash,
    // and the front (street + skyline) that occludes the channel
    const [skyC, skyG] = layer(), [skyLitC, litG] = layer(), [frontC, frontG] = layer();
    let g = skyG;
    const hy = oy + cy;
    const P = (x, y, z) => [ox + cx + f * x / z, hy - f * y / z];

    let gr = g.createLinearGradient(0, 0, 0, hy);
    gr.addColorStop(0, '#03050a');
    gr.addColorStop(0.6, '#0d111e');
    gr.addColorStop(1, '#2a2330');
    g.fillStyle = gr;
    g.fillRect(0, 0, B, hy + 1);

    // A flash reveals the cloud deck: the same cloud cells, barely visible in the dark,
    // light up from inside (scattering in the cloud) — brightest at their thick cores
    gr = litG.createLinearGradient(0, 0, 0, hy);
    gr.addColorStop(0, '#4a5173');
    gr.addColorStop(0.7, '#6d7299');
    gr.addColorStop(1, '#8a86a6');
    litG.fillStyle = gr;
    litG.fillRect(0, 0, B, hy + 1);
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * B, y = Math.pow(Math.random(), 0.7) * hy * 0.95, r = 40 + Math.random() * 200;
      for (const [G2, col, a] of [[skyG, '70,72,95', 0.07], [litG, Math.random() < 0.5 ? '225,228,255' : '40,44,70', 0.28]]) {
        G2.save();
        G2.translate(x, y); G2.scale(1, 0.4 + Math.random() * 0.2);
        const cg = G2.createRadialGradient(0, 0, 0, 0, 0, r);
        cg.addColorStop(0, `rgba(${col},${a})`);
        cg.addColorStop(1, `rgba(${col},0)`);
        G2.fillStyle = cg;
        G2.beginPath(); G2.arc(0, 0, r, 0, TAU); G2.fill();
        G2.restore();
      }
    }

    g = frontG;
    gr = g.createLinearGradient(0, hy, 0, B);
    gr.addColorStop(0, '#0d1019');
    gr.addColorStop(1, '#040509');
    g.fillStyle = gr;
    g.fillRect(0, hy, B, B - hy);

    const lights = [];
    for (const side of [-5.5, 5.5]) {
      for (let z = 5; z < 150; z += 12) {
        lights.push({ x: side - Math.sign(side) * 1.2, y: 5 - HC, z, pole: side, col: [255, 172, 92], size: 2.2 });
      }
    }
    const neon = [[255, 60, 90], [80, 220, 255], [120, 255, 140], [255, 200, 60], [200, 110, 255]];
    for (let i = 0; i < 9; i++) {
      lights.push({
        x: (Math.random() - 0.5) * 40, y: 1.5 + Math.random() * 5 - HC, z: 25 + Math.random() * 90,
        col: neon[i % neon.length], size: 1.2 + Math.random() * 1.5,
      });
    }

    // wet asphalt: reflections are mirrored in the ground plane and smeared vertically by its roughness
    for (const L of lights) {
      const [sx] = P(L.x, L.y, L.z);
      const [, gyy] = P(L.x, -HC, L.z);
      const [, my] = P(L.x, -2 * HC - L.y, L.z);
      const r = f * L.size / L.z;
      const len = Math.max(r, my - gyy);
      g.save();
      g.translate(sx, gyy + len * 0.7);
      g.scale(1, Math.max(1.5, len / r));
      const rg = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.7);
      rg.addColorStop(0, `rgba(${L.col},0.32)`);
      rg.addColorStop(1, `rgba(${L.col},0)`);
      g.fillStyle = rg;
      g.beginPath(); g.arc(0, 0, r * 0.7, 0, TAU); g.fill();
      g.restore();
    }

    // puddles: still water is a near-perfect mirror, so reflections there are sharp, not smeared
    puddles = [];
    for (let i = 0; i < 16; i++) {
      const x = (Math.random() - 0.5) * 12, z = 3.5 + Math.pow(Math.random(), 1.4) * 28;
      for (let k = 0; k < 3; k++) {
        puddles.push({ x: x + (Math.random() - 0.5) * 1.5, z: z + (Math.random() - 0.5) * 1.2,
          rx: 0.4 + Math.random() * 1.6, rz: 0.25 + Math.random() * 0.9 });
      }
    }
    // drawn on a layer, then composited twice (blurred + sharp) so the water line is soft
    const [pl, pg] = layer();
    { const g = pg;
    g.save();
    g.beginPath();
    for (const q of puddles) {
      const [px, py] = P(q.x, -HC, q.z);
      g.moveTo(px + f * q.rx / q.z, py);
      g.ellipse(px, py, f * q.rx / q.z, f * HC * q.rz / (q.z * q.z), 0, 0, TAU);
    }
    g.clip();
    gr = g.createLinearGradient(0, hy, 0, B);
    gr.addColorStop(0, 'rgba(42,36,50,0.9)');       // mirrored horizon glow
    gr.addColorStop(0.5, 'rgba(14,17,28,0.9)');     // mirrored zenith
    g.fillStyle = gr;
    g.fillRect(0, hy, B, B - hy);
    for (const L of lights) {
      const [sx] = P(L.x, L.y, L.z);
      const [, my] = P(L.x, -2 * HC - L.y, L.z);
      const r = f * L.size / L.z;
      g.save();
      g.translate(sx, my);
      g.scale(1, 1.8);
      const rg = g.createRadialGradient(0, 0, 0, 0, 0, r * 0.6);
      rg.addColorStop(0, `rgba(${L.col},0.75)`);
      rg.addColorStop(0.3, `rgba(${L.col},0.2)`);
      rg.addColorStop(1, `rgba(${L.col},0)`);
      g.fillStyle = rg;
      g.beginPath(); g.arc(0, 0, r * 0.6, 0, TAU); g.fill();
      g.restore();
    }
    g.restore();
    }
    const pb = mkCanvas(pl.width / 6, pl.height / 6);
    pb.getContext('2d').drawImage(pl, 0, 0, pb.width, pb.height);
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 0.45; g.drawImage(pb, 0, 0, pl.width, pl.height);
    g.globalAlpha = 0.4; g.drawImage(pl, 0, 0);
    g.restore();

    rainLights = lights.filter(L => L.pole !== undefined && L.z < 32).map(L => ({ x: L.x, y: L.y, z: L.z, I: 16 }));
    rainLights.push({ x: 0, y: 0.2, z: -0.6, I: 0.35 });   // warm light spilling from our own room

    drawSkyline(g, hy + 3, 18, 60, 15, 90, '#111523', 0.18, 0.55);
    gr = g.createLinearGradient(0, hy - 130, 0, hy + 6);
    gr.addColorStop(0, 'rgba(45,42,58,0)');
    gr.addColorStop(1, 'rgba(45,42,58,0.55)');
    g.fillStyle = gr;
    g.fillRect(0, hy - 130, B, 136);
    drawSkyline(g, hy + 9, 40, 110, 40, 210, '#070a11', 0.14, 1);

    for (const L of lights) {
      const [sx, sy] = P(L.x, L.y, L.z);
      if (L.pole !== undefined) {
        const [bx, by] = P(L.pole, -HC, L.z);
        const [tx, ty] = P(L.pole, L.y + 0.2, L.z);
        g.strokeStyle = '#161923';
        g.lineWidth = Math.max(0.5, f * 0.15 / L.z);
        g.beginPath(); g.moveTo(bx, by); g.lineTo(tx, ty); g.lineTo(sx, sy); g.stroke();
      }
      const r = f * L.size / L.z;
      const rg = g.createRadialGradient(sx, sy, 0, sx, sy, r);
      rg.addColorStop(0, `rgba(${L.col},0.6)`);
      rg.addColorStop(0.35, `rgba(${L.col},0.16)`);
      rg.addColorStop(1, `rgba(${L.col},0)`);
      g.fillStyle = rg;
      g.beginPath(); g.arc(sx, sy, r, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,245,225,0.95)';
      g.beginPath(); g.arc(sx, sy, Math.max(0.7, f * 0.1 / L.z), 0, TAU); g.fill();
    }

    // puddles mirror the flash-lit sky
    const [plitC, plitG] = layer();
    plitG.save();
    plitG.setTransform(1, 0, 0, 1, 0, 0);
    plitG.globalAlpha = 0.45; plitG.drawImage(pb, 0, 0, pl.width, pl.height);
    plitG.globalAlpha = 0.3; plitG.drawImage(pl, 0, 0);
    plitG.globalAlpha = 1;
    plitG.globalCompositeOperation = 'source-in';
    gr = plitG.createLinearGradient(0, hy * bs, 0, B * bs);
    gr.addColorStop(0, '#9a9ec4'); gr.addColorStop(0.6, '#5d6288');   // mirror of the lit cloud deck
    plitG.fillStyle = gr;
    plitG.fillRect(0, 0, plitC.width, plitC.height);
    plitG.restore();

    bgSharp = mkCanvas(B * bs, B * bs);
    const sg = bgSharp.getContext('2d');
    sg.drawImage(skyC, 0, 0); sg.drawImage(frontC, 0, 0);

    // blurred copies = what you see when your eyes focus on the glass
    // repeated 2× down/up-sampling with bilinear filtering approximates a Gaussian blur
    const blur = c => {
      let cur = c;
      for (let k = 0; k < 5; k++) {
        const n = mkCanvas(cur.width / 2, cur.height / 2);
        n.getContext('2d').drawImage(cur, 0, 0, n.width, n.height);
        cur = n;
      }
      for (let k = 0; k < 2; k++) {
        const n = mkCanvas(cur.width * 2, cur.height * 2);
        n.getContext('2d').drawImage(cur, 0, 0, n.width, n.height);
        cur = n;
      }
      return cur;
    };
    layers = {
      sharp: { sky: skyC, skyLit: skyLitC, front: frontC, puddleLit: plitC },
      blur: { sky: blur(skyC), skyLit: blur(skyLitC), front: blur(frontC), puddleLit: blur(plitC) },
    };

    // rotated 180°: a water drop is a tiny ball lens that shows the scene upside down
    bgFlip = mkCanvas(B * 0.5, B * 0.5);
    const fctx = bgFlip.getContext('2d');
    fctx.translate(bgFlip.width, bgFlip.height);
    fctx.rotate(Math.PI);
    fctx.drawImage(bgSharp, 0, 0, bgFlip.width, bgFlip.height);
  }

  function drawSkyline(g, base, wMin, wMax, hMin, hMax, color, winProb, ws) {
    let x = -Math.random() * wMax;
    while (x < B) {
      const w = wMin + Math.random() * (wMax - wMin);
      const h = hMin + Math.pow(Math.random(), 1.5) * (hMax - hMin);
      g.fillStyle = color;
      g.fillRect(x, base - h, w, h + 2);
      const gx = 5 * ws, gy = 7 * ws;
      for (let wy = base - h + gy; wy < base - gy; wy += gy) {
        for (let wx = x + gx * 0.6; wx < x + w - gx * 0.6; wx += gx) {
          if (Math.random() < winProb) {
            g.fillStyle = Math.random() < 0.75
              ? `rgba(255,${190 + Math.random() * 40 | 0},120,${0.3 + Math.random() * 0.5})`
              : `rgba(170,210,255,${0.25 + Math.random() * 0.4})`;
            g.fillRect(wx, wy, 2.2 * ws, 3 * ws);
          }
        }
      }
      x += w + Math.random() * 6 - 1;
    }
  }

  // ---------- Falling rain (3D) ----------
  const drops = [];
  const splashes = [];
  const ripples = [];

  function spawnDrop(d, initial) {
    // pdf ∝ z instead of the frustum's z²: far drops are sub-pixel, so we spend the budget near the eye
    d.z = Math.sqrt(ZN * ZN + Math.random() * (ZF * ZF - ZN * ZN));
    d.D = sampleD(state.rateNow);
    d.v = termVel(d.D);
    // only the part of the (possibly rotated) world that is actually on screen
    const c = Math.abs(Math.cos(state.theta)), sn = Math.abs(Math.sin(state.theta));
    const hw = (W * c + H * sn) / 2 + 20, hh = (W * sn + H * c) / 2 + 20;
    d.xl = -hw * d.z / f;
    d.xr = hw * d.z / f;
    const ytop = (cy - H / 2 + hh) * d.z / f;
    const drift = state.wind * (ytop + HC) / d.v;
    // rain falls in curtains (bands of denser rain drifting with the wind): rejection sampling
    for (let k = 0; k < 4; k++) {
      d.x = d.xl - Math.max(0, drift) + Math.random() * (d.xr - d.xl + Math.abs(drift));
      const c = 0.5 + 0.5 * noise1((d.x - state.wind0 * time) / 7 + 300 + time * 0.03);
      if (Math.random() < 0.35 + 0.65 * c) break;
    }
    d.y = initial ? -HC + Math.random() * (ytop + HC) : ytop + Math.random() * 0.3;
    d.vx = state.wind;
    return d;
  }

  function targetDropCount() {
    const c = Math.abs(Math.cos(state.theta)), sn = Math.abs(Math.sin(state.theta));
    const area = (W * c + H * sn) * (W * sn + H * c);
    return quality * Math.min(4000, 1.6 * visibleDensity(state.rateNow) * area / (390 * 844));
  }

  const RHO = 1000, SIGMA = 0.072, MU = 0.001;   // water: density, surface tension, viscosity (SI)
  const RIPPLE_MODES = [0.012, 0.02, 0.035].map((lambda, i) => {
    const k = TAU / lambda, nu = MU / RHO;
    const w = Math.sqrt(G * k + SIGMA / RHO * k ** 3);
    const cg = (G + 3 * SIGMA / RHO * k * k) / (2 * w);     // group velocity
    return { cg, damp: 2 * nu * k * k + 1.2, w: [0.7, 1, 0.8][i] };   // + radiation/geometric loss
  });
  const inPuddle = (x, z) => puddles.some(q => ((x - q.x) / q.rx) ** 2 + ((z - q.z) / q.rz) ** 2 < 1);

  function impact(d) {
    if (d.z > 12) return;
    const puddle = inPuddle(d.x, d.z);
    if (puddle && ripples.length < 320 * quality) {
      // ripple energy ∝ drop kinetic energy; amplitude ∝ √E
      const E = d.D ** 3 * d.v * d.v;
      ripples.push({ x: d.x, z: d.z, age: 0, amp: Math.min(1, Math.sqrt(E) / 40), D: d.D });
    }
    // Splash or deposition? Cossali et al. (1997) for a drop onto a liquid film:
    // splash when K = We·Oh^−0.4 > 2100 + 5880·δ^1.44 (δ = film thickness / D)
    const Dm = d.D * 1e-3;
    const We = RHO * Dm * d.v * d.v / SIGMA;
    const Oh = MU / Math.sqrt(RHO * SIGMA * Dm);
    const K = We * Math.pow(Oh, -0.4);
    const film = puddle ? 5 : 0.3;                          // mm of water
    const Kc = 2100 + 5880 * Math.pow(Math.min(film / d.D, 1.5), 1.44);
    if (d.z < 7 && K > Kc && splashes.length < 700 * quality) {
      // crown splash: secondary droplets from the crown rim, thrown out ballistically;
      // more energetic impacts eject more (and relatively smaller) droplets
      const ex = K / Kc - 1;
      const n = Math.min(12, (2 + 3 * ex + Math.random() * 2) | 0);
      const s0 = d.v * (0.12 + 0.05 * Math.min(ex, 3));
      for (let k = 0; k < n; k++) {
        const el = (15 + Math.random() * 50) * Math.PI / 180, az = Math.random() * TAU;
        const sp = s0 * (0.6 + Math.random() * 0.8);
        splashes.push({
          x: d.x, y: -HC + 0.001, z: d.z,
          vx: sp * Math.cos(el) * Math.cos(az) + d.vx * 0.2,
          vy: sp * Math.sin(el),
          vz: sp * Math.cos(el) * Math.sin(az),
          D: d.D * (0.1 + Math.random() * 0.25) / Math.sqrt(1 + ex),
        });
      }
    }
  }

  function updateRain(dt) {
    const target = targetDropCount() | 0;
    while (drops.length < target) drops.push(spawnDrop({}, true));
    if (drops.length > target) drops.length = target;

    const U = state.wind;
    const margin = 2 + Math.abs(U) * 3;
    const gAmp = 0.35 * Math.abs(state.wind0) + 0.6;
    for (const d of drops) {
      // horizontal drag relaxes the drop's velocity toward the local wind, τ = v_t / g
      const tau = d.v / G;
      const Ul = state.wind0 + gAmp * gustField(d.x, d.z, time);
      d.vx += (Ul - d.vx) * Math.min(1, dt / tau);
      d.x += d.vx * dt;
      d.y -= d.v * dt;
      if (d.y <= -HC) { impact(d); spawnDrop(d, false); }
      else if (d.x < d.xl - margin || d.x > d.xr + margin) spawnDrop(d, false);
    }

    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.vy -= G * dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
      if (s.y < -HC || s.z < 0.2) { splashes[i] = splashes[splashes.length - 1]; splashes.pop(); }
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.age += dt;
      if (r.age > 1.6) { ripples[i] = ripples[ripples.length - 1]; ripples.pop(); }
    }
  }

  // stroke batching: bucket by tint, alpha and width so thousands of streaks cost a few dozen draw calls
  const AB = 7, AMAX = 0.85, WB = 5, WREP = [0.6, 1.1, 1.9, 3.2, 5.5], WEDGE = [0.85, 1.5, 2.5, 4.2];
  const TINTS = ['200,208,225', '255,208,160', '235,240,255'];   // sky-lit / sodium-lamp-lit / headlight-lit
  let buckets = [];
  function bucket(alpha, width, tint) {
    if (alpha < 0.012) return null;
    const ai = Math.min(AB - 1, (alpha / AMAX * AB) | 0);
    let wi = 0;
    while (wi < 4 && width > WEDGE[wi]) wi++;
    const k = (tint * AB + ai) * WB + wi;
    return buckets[k] || (buckets[k] = new Path2D());
  }
  function flushBuckets() {
    ctx.lineCap = 'round';
    for (let k = 0; k < buckets.length; k++) {
      const p = buckets[k];
      if (!p) continue;
      const wi = k % WB, ai = ((k / WB) | 0) % AB, tint = (k / (WB * AB)) | 0;
      ctx.strokeStyle = `rgba(${TINTS[tint]},${((ai + 0.5) / AB * AMAX).toFixed(3)})`;
      ctx.lineWidth = WREP[wi];
      ctx.stroke(p);
    }
    buckets = [];
  }

  // Radiance of a drop: dim ambient sky glow plus every nearby lamp, falling off with 1/d²
  // and weighted by a Henyey–Greenstein phase function — water drops scatter strongly
  // forward, so rain between you and a lamp lights up.
  const SKY_E = 1.3, HG_G = 0.55;
  let illumE = 0, illumWarm = 0, frameLights = [];
  function illuminate(x, y, z) {
    const vl = Math.hypot(x, y, z) || 1;
    let lamp = 0, white = 0;
    for (const L of frameLights) {
      const dx = x - L.x, dy = y - L.y, dz = z - L.z;
      const d2 = dx * dx + dy * dy + dz * dz, d = Math.sqrt(d2);
      const cos = -(dx * x + dy * y + dz * z) / (d * vl);    // light→drop vs drop→camera
      const ph = (1 - HG_G * HG_G) / Math.pow(1 + HG_G * HG_G - 2 * HG_G * cos, 1.5);
      // headlights are beams: only rain inside the cone is lit
      const beam = L.bz ? Math.pow(Math.max(0, (dz * L.bz + dy * L.by) / d), 6) : 1;
      const e = L.I * ph * beam / (d2 + 0.6);
      if (L.white) white += e; else lamp += e;
    }
    illumE = SKY_E + lamp + white;
    illumWarm = white > SKY_E * 0.8 && white > lamp ? 2 : lamp > SKY_E * 0.8 ? 1 : 0;
  }

  function streak(x, y, z, vx, vy, vz, D, focus) {
    const x2 = x - vx * EXPOSURE, y2 = y - vy * EXPOSURE, z2 = z - vz * EXPOSURE;
    if (z < 0.2 || z2 < 0.2) return;
    const s1x = cx + f * x / z, s1y = cy - f * y / z;
    const s2x = cx + f * x2 / z2, s2y = cy - f * y2 / z2;
    if ((s1x < -ox && s2x < -ox) || (s1x > W + ox && s2x > W + ox) || s1y < -oy || s2y > H + oy) return;
    const wPhys = f * D * 1e-3 / z;
    const coc = f * APERTURE * Math.abs(1 / z - 1 / focus);   // circle of confusion
    const width = Math.max(0.5, wPhys) + coc;
    // Garg & Nayar: a pixel only sees the drop for τ = D / v of the exposure T
    const speed = Math.max(0.3, Math.hypot(vx, vy, vz));
    const cover = D * 1e-3 / (speed * EXPOSURE);
    illuminate(x, y, z);
    const alpha = 34 * cover * illumE * Math.exp(-z / 14) * Math.min(1, (wPhys * 2 + 0.35) / width);
    const p = bucket(Math.min(AMAX, alpha), width, illumWarm);
    if (!p) return;
    p.moveTo(s1x, s1y);
    p.lineTo(s2x, s2y);
  }

  // a big eaves drop right outside the pane is mostly transparent: a faint body with a
  // bright refracted highlight along one side, smeared by motion blur
  function drawDrip(s, focus) {
    const z = s.z, x1 = cx + f * s.x / z, y1 = cy - f * s.y / z;
    const y2 = cy - f * (s.y - s.vy * EXPOSURE) / z;
    const w = f * s.D * 1e-3 / z, coc = f * APERTURE * Math.abs(1 / z - 1 / focus);
    ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(200,215,240,${(0.12 / (1 + coc * 0.3)).toFixed(3)})`;
    ctx.lineWidth = w + coc;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1, Math.min(y1 - 1, y2)); ctx.stroke();
    ctx.strokeStyle = `rgba(255,250,240,${(0.45 / (1 + coc * 0.5)).toFixed(3)})`;
    ctx.lineWidth = Math.max(0.8, w * 0.15) + coc * 0.5;
    ctx.beginPath(); ctx.moveTo(x1 - w * 0.25, y1); ctx.lineTo(x1 - w * 0.25, Math.min(y1 - 1, y2)); ctx.stroke();
  }

  function drawRain() {
    const focus = state.glass ? 0.4 : 8;

    const rp = [new Path2D(), new Path2D(), new Path2D()];
    for (const r of ripples) {
      const sx = cx + f * r.x / r.z, sy = cy + f * HC / r.z;
      if (sx < -ox - 50 || sx > W + ox + 50 || sy > H + oy) continue;
      // A dispersive wave packet: each wavenumber k travels at its group velocity
      // c_g = dω/dk with ω² = gk + (σ/ρ)k³, and is damped viscously as exp(−2νk²t).
      // Short capillary waves lead, longer gravity waves trail, radius spreads ∝ 1/√r.
      for (const w of RIPPLE_MODES) {
        const rad = 0.003 + w.cg * r.age;
        const a = r.amp * Math.exp(-w.damp * r.age) * Math.min(1, r.age * 30) / Math.sqrt(1 + rad * 40) * w.w;
        if (a < 0.05) continue;
        const rx = f * rad / r.z, ry = rx * HC / r.z;
        const p = rp[Math.min(2, (a * 4) | 0)];
        p.moveTo(sx + rx, sy);
        p.ellipse(sx, sy, rx, ry, 0, 0, TAU);
      }
    }
    ctx.lineWidth = state.glass ? 2 : 0.8;
    rp.forEach((p, i) => {
      ctx.strokeStyle = `rgba(175,190,215,${(state.glass ? 0.06 : 0.12) * (i + 1)})`;
      ctx.stroke(p);
    });

    for (const s of splashes) {
      if (s.drip) { drawDrip(s, focus); continue; }
      streak(s.x, s.y, s.z, s.vx, s.vy, s.vz, s.D, focus);
    }
    for (const d of drops) streak(d.x, d.y, d.z, d.vx, -d.v, 0, d.D, focus);
    flushBuckets();
    if (flashLevel > 0.08) drawFrozenRain(focus);
  }

  // A return stroke lasts well under a millisecond: in its light each drop moves only a few
  // millimetres, so the rain appears frozen as bright short dashes over the blurred streaks.
  function drawFrozenRain(focus) {
    const a = Math.min(0.9, flashLevel * 0.9);
    const p = new Path2D();
    let lw = 0, n = 0;
    for (const d of drops) {
      if (d.z > 12) continue;
      const sx = cx + f * d.x / d.z, sy = cy - f * d.y / d.z;
      if (sx < -ox || sx > W + ox || sy < -oy || sy > H + oy) continue;
      const len = Math.max(1.2, f * d.v * 0.004 / d.z);           // ~4 ms of persistence
      p.moveTo(sx, sy); p.lineTo(sx - f * d.vx * 0.004 / d.z, sy - len);
      lw += f * d.D * 1e-3 / d.z + f * APERTURE * Math.abs(1 / d.z - 1 / focus); n++;
    }
    if (!n) return;
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(0.8, Math.min(4, lw / n));
    ctx.strokeStyle = `rgba(225,232,255,${(a / (1 + (state.glass ? 2 : 0))).toFixed(3)})`;
    ctx.stroke(p);
  }

  // ---------- Traffic ----------
  // Cars drive on the left (Japan): oncoming traffic uses the right-hand lane as we look
  // down the street. Headlights light the rain ahead of them, tyres throw up spray, and
  // their hiss is Doppler-shifted, f' = f·c / (c − v_r).
  const cars = [];
  let nextCar = 4;
  function spawnCar() {
    const oncoming = Math.random() < 0.55, v = 8 + Math.random() * 7;
    cars.push({ x: oncoming ? 1.8 : -1.8, z: oncoming ? 170 : 2.5, vz: oncoming ? -v : v, oncoming,
      voice: audio ? audio.carVoice() : null });
  }
  function updateCars(dt) {
    nextCar -= dt;
    if (nextCar <= 0) { if (cars.length < 3) spawnCar(); nextCar = 5 + Math.random() * 14; }
    frameLights = rainLights.slice();
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i];
      c.z += c.vz * dt;
      if (c.z < 2 || c.z > 175) {
        if (c.voice) c.voice.stop();
        cars.splice(i, 1);
        continue;
      }
      if (c.oncoming && c.z < 60) {
        for (const s of [-0.75, 0.75]) frameLights.push({ x: c.x + s, y: -HC + 0.7, z: c.z - 2, I: 60, white: true, bz: -1, by: -0.08 });
      }
      // spray from the tyres: water picked up by the tread is flung off behind and upward
      if (c.z < 45 && splashes.length < 700 * quality) {
        const n = Math.random() < dt * 90 * Math.min(1, 0.3 + state.rateNow / 20) ? 2 : 0;
        const rear = c.z - Math.sign(c.vz) * 1.3;
        for (let k = 0; k < n; k++) {
          splashes.push({
            x: c.x + (Math.random() < 0.5 ? -0.8 : 0.8) + (Math.random() - 0.5) * 0.2, y: -HC + 0.05, z: rear,
            vx: (Math.random() - 0.5) * 2, vy: 0.6 + Math.random() * 2.2, vz: c.vz * (0.15 + Math.random() * 0.3),
            D: 0.3 + Math.random() * 0.8,
          });
        }
      }
      if (c.voice) {
        const r = Math.hypot(c.x, HC, c.z);
        const vr = -c.z * c.vz / r;                         // speed toward us
        c.voice.set(Math.min(1, 7.5 / r), SOUND_SPEED / (SOUND_SPEED - vr), c.x / r * 3, r);
      }
    }
  }
  function drawCars() {
    if (!cars.length) return;
    const focus = state.glass ? 0.4 : 8;
    // bodies first: dark silhouettes (cabin + body) catching a little street light
    ctx.fillStyle = 'rgba(6,8,13,0.92)';
    for (const c of cars) {
      const z = c.z, P = (x, y) => [cx + f * x / z, cy - f * y / z];
      const [x0, y0] = P(c.x - 0.9, -HC + 0.25), [x1, y1] = P(c.x + 0.9, -HC + 0.95);
      const [x2, y2] = P(c.x - 0.7, -HC + 1.45), [x3] = P(c.x + 0.7, -HC + 1.45);
      ctx.beginPath();
      ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y2); ctx.lineTo(x1, y1); ctx.lineTo(x1, y0);
      ctx.closePath(); ctx.fill();
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const c of cars) {
      const z = c.z;
      const coc = f * APERTURE * Math.abs(1 / z - 1 / focus);
      const col = c.oncoming ? '255,246,228' : '255,40,28';
      for (const s of [-0.75, 0.75]) {
        const lx = c.x + s, ly = -HC + (c.oncoming ? 0.7 : 0.9);
        const sx = cx + f * lx / z, sy = cy - f * ly / z;
        const r = f * (c.oncoming ? 1.4 : 0.45) / z + coc * 1.5;
        const a = (c.oncoming ? 0.95 : 0.8) / (1 + coc * 0.08);
        let gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
        gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.15, `rgba(${col},${a * 0.5})`); gr.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = gr;
        ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
        // reflection in the wet road, stretched toward us by the surface roughness
        const gy = cy + f * HC / z, my = cy + f * (2 * HC + ly) / z;
        const len = Math.max(4, (my - gy) * 6), w = f * 0.35 / z + coc;
        ctx.save();
        ctx.translate(sx, gy + len / 2);
        ctx.scale(1, len / w);
        gr = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
        gr.addColorStop(0, `rgba(${col},${a * 0.35})`); gr.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = gr;
        ctx.fillRect(-w, -w, w * 2, w * 2);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  // ---------- Eaves drip (雨だれ) ----------
  // The ledge above the window collects rain; a drop leaves its edge once its weight beats
  // surface tension — Tate's law with the Harkins–Brown factor: V = 0.6·2πrσ/(ρg).
  // Drip rate = inflow / V. Like a dripping faucet (Shaw 1984) the rhythm is regular at low
  // flow, becomes period-doubled (long–short) and then irregular as the flow increases.
  const DRIP_V = 0.6 * 2 * Math.PI * 0.003 * 0.072 / (1000 * G);   // ≈ 0.08 ml
  const LEDGE_AREA = 0.02;                                            // m² draining to this edge
  let dripT = 2, dripPhase = 0;
  function updateDrips(dt) {
    const rate = LEDGE_AREA * state.rateNow / 3.6e6 / DRIP_V;        // drops per second
    dripT -= dt;
    if (dripT > 0) return;
    let T = 1 / Math.max(rate, 0.03);
    if (rate > 1.5) T *= dripPhase++ % 2 ? 0.75 : 1.25;               // period doubling
    if (rate > 3.5) T *= 0.5 + Math.random();                          // chaotic regime
    dripT = Math.min(T * (1 + (Math.random() - 0.5) * 0.06), 30);
    const Dd = Math.cbrt(6 * DRIP_V / Math.PI) * 1000;                 // ≈ 5.4 mm
    splashes.push({ x: 0.1, y: 0.3, z: 0.36, vx: state.wind * 0.03, vy: 0, vz: 0, D: Dd, drip: true });
    if (audio) audio.drip(Math.sqrt(2 * 0.5 / G));                    // falls 0.5 m onto the sill
  }

  // ---------- Drops on the window glass ----------
  const glassDrops = [];
  let gw = 0, gh = 0, pinBase = null, pinCur = null;
  let nextGlassHit = 0, pinRelaxT = 0, trailFadeT = 0;

  function initPinGrid() {
    gw = Math.ceil(W / PC) + 2; gh = Math.ceil(H / PC) + 2;
    pinBase = new Float32Array(gw * gh);
    pinCur = new Float32Array(gw * gh);
    const S = 6, cw = Math.ceil(gw / S) + 2, ch = Math.ceil(gh / S) + 2;
    const coarse = new Float32Array(cw * ch).map(() => 0.8 + Math.random() * 0.45);
    for (let j = 0; j < gh; j++) {
      for (let i = 0; i < gw; i++) {
        const u = i / S, v = j / S, i0 = u | 0, j0 = v | 0, fu = u - i0, fv = v - j0;
        const c = coarse[i0 + j0 * cw] * (1 - fu) * (1 - fv) + coarse[i0 + 1 + j0 * cw] * fu * (1 - fv)
          + coarse[i0 + (j0 + 1) * cw] * (1 - fu) * fv + coarse[i0 + 1 + (j0 + 1) * cw] * fu * fv;
        pinBase[i + j * gw] = c * (0.85 + Math.random() * 0.35);
      }
    }
    pinCur.set(pinBase);
  }
  function pinIndex(x, y) {
    const i = clamp((x / PC) | 0, 0, gw - 1), j = clamp((y / PC) | 0, 0, gh - 1);
    return i + j * gw;
  }
  const pinAt = (x, y) => pinCur[pinIndex(x, y)];
  function wetPath(x, y, r) {
    // a drop that just passed leaves a water film: lower contact-angle hysteresis, so later drops follow
    const n = Math.ceil(r / PC);
    const i0 = (x / PC) | 0, j0 = (y / PC) | 0;
    for (let j = j0 - n; j <= j0 + n; j++) {
      if (j < 0 || j >= gh) continue;
      for (let i = i0 - n; i <= i0 + n; i++) {
        if (i < 0 || i >= gw) continue;
        const k = i + j * gw;
        pinCur[k] = Math.min(pinCur[k], pinBase[k] * 0.45);
      }
    }
  }

  function makeGlassDrop(x, y, V) {
    const d = { x, y, V, a: 0, r: 0, moving: false, speed: 0, steer: 0, dep: 0, depT: 0.05 + Math.random() * 0.2, fresh: true, spread: 0 };
    setDropVolume(d);
    return d;
  }
  // a drop on glass is roughly a spherical cap with ~90° contact angle: V = 2/3·π·a³
  function setDropVolume(d) { d.a = Math.cbrt(1.5 * d.V / Math.PI); d.r = d.a * PX_PER_MM; }

  // the window has already been rained on for a while
  function seedGlass() {
    const n = (W * H) / (390 * 844) * (60 + 12 * Math.sqrt(state.rate));
    for (let i = 0; i < n; i++) {
      const D = sampleD(state.rateNow) * (0.4 + Math.random() * 0.5);
      const d = makeGlassDrop(Math.random() * W, Math.random() * H, Math.PI / 6 * D * D * D);
      d.fresh = false;
      glassDrops.push(d);
    }
  }

  function glassImpact() {
    const D = sampleD(state.rateNow);
    const V = Math.PI / 6 * D * D * D;
    const x = Math.random() * W, y = Math.random() * H;
    if (D > 2.5) {
      // large drops shatter on impact into a main drop plus satellites
      const main = makeGlassDrop(x, y, V * 0.6);
      main.spread = 1;
      glassDrops.push(main);
      const n = 3 + (Math.random() * 4 | 0);
      for (let k = 0; k < n; k++) {
        const ang = Math.random() * TAU, dist = D * PX_PER_MM * (1 + Math.random() * 2.5);
        glassDrops.push(makeGlassDrop(x + Math.cos(ang) * dist, y + Math.sin(ang) * dist, V * 0.4 / n));
      }
    } else {
      const d = makeGlassDrop(x, y, V);
      d.spread = D > 1 ? 1 : 0;
      glassDrops.push(d);
    }
    if (audio) audio.tick(D, x / W * 1.6 - 0.8);
  }

  function updateGlass(dt) {
    if (!state.glass) { glassDrops.length = 0; return; }

    // Poisson arrivals; more rain hits the window when the wind blows
    const lambda = 4 * Math.pow(state.rateNow, 0.75) * (0.35 + Math.abs(state.wind) / 6) * (W * H) / (390 * 844);
    nextGlassHit -= dt;
    while (nextGlassHit <= 0) {
      if (glassDrops.length < 650 * quality) glassImpact();
      nextGlassHit += -Math.log(1 - Math.random()) / lambda;
    }

    pinRelaxT += dt;
    if (pinRelaxT > 0.25) {
      for (let k = 0; k < pinCur.length; k++) pinCur[k] += (pinBase[k] - pinCur[k]) * 0.008;
      pinRelaxT = 0;
    }

    const gx = state.gx, gy = state.gy;
    // wind skimming the pane: the boundary layer leaves ~25 % of the free-stream speed near the glass
    const Uw = 0.25 * state.wind;
    tctx.lineCap = 'butt';
    for (const d of glassDrops) {
      const pin = pinAt(d.x, d.y) * (d.moving ? 0.75 : 1);
      // Forces on the drop: gravity ρVg (∝ a³) and aerodynamic drag ½ρ_air·U²·C_d·πa² (∝ a²),
      // against contact-line pinning 2aσΔ (∝ a). It slides once the resultant wins.
      const am = d.a * 1e-3;
      const Fpin = 2 * am * 0.072 * HYST * pin;
      const Fg = 1000 * (2 / 3) * Math.PI * am * am * am * G * state.gip;
      const Fw = 0.5 * 1.2 * Uw * Math.abs(Uw) * Math.PI * am * am;
      const Fx = Fg * gx + Fw * gy, Fy = Fg * gy - Fw * gx;             // world-horizontal = (gy, −gx)
      const Fm = Math.hypot(Fx, Fy) || 1e-12;
      const q = Fm / Fpin;
      const ux = Fx / Fm, uy = Fy / Fm, px = -uy, py = ux;
      if (q > 1) {
        d.moving = true;
        // viscous dissipation at the moving contact line: Ca = μU/σ ∝ (F − F_c),
        // U ≈ σΔ/(μ·C)·(q − 1) with C ≈ 60 (log cut-off / θ³ factor)
        const target = Math.min(200, 3 + 0.072 * HYST / (0.001 * 60) * 1000 * (q - 1)) * PX_PER_MM;
        d.speed += (target - d.speed) * Math.min(1, dt / 0.06);
        const off = d.r * 1.3 + 3;
        const pl = pinAt(d.x + (px + ux) * off, d.y + (py + uy) * off);
        const pr = pinAt(d.x + (-px + ux) * off, d.y + (-py + uy) * off);
        d.steer += ((pr - pl) * 2 + (Math.random() - 0.5) * 0.8 - d.steer) * Math.min(1, dt * 6);
        let dx = ux + px * d.steer, dy = uy + py * d.steer;
        const m = Math.hypot(dx, dy); dx /= m; dy /= m;
        d.rot = Math.atan2(-dx, dy);                        // the teardrop points along its motion
        const ds = d.speed * dt;
        const x0 = d.x, y0 = d.y;
        d.x += dx * ds; d.y += dy * ds;
        wetPath(d.x, d.y, d.r);
        tctx.strokeStyle = 'rgba(140,160,190,0.022)';
        tctx.lineWidth = d.r * 1.2;
        tctx.beginPath(); tctx.moveTo(x0, y0); tctx.lineTo(d.x, d.y); tctx.stroke();

        // the sliding drop sheds volume into a trail of tiny residual beads
        const loss = Math.min(d.V * 0.5, 0.01 * d.a * ds / PX_PER_MM);
        d.V -= loss; d.dep += loss;
        if (d.dep > d.depT) {
          const res = makeGlassDrop(0, 0, d.dep);
          res.fresh = false;
          const back = d.r + res.r + 0.5;
          res.x = d.x - dx * back; res.y = d.y - dy * back;
          glassDrops.push(res);
          d.dep = 0; d.depT = 0.05 + Math.random() * 0.2;
        }
        setDropVolume(d);
      } else {
        d.moving = false; d.speed = 0;
      }
      if (d.spread > 0) d.spread = Math.max(0, d.spread - dt / 0.08);
      d.V -= dt * 0.0004 * d.a;    // slow evaporation
      if (d.V < 0.004) d.dead = true;
      else setDropVolume(d);
      if (d.y - d.r > H || d.y + d.r < 0 || d.x + d.r < 0 || d.x - d.r > W) d.dead = true;
    }

    mergeGlassDrops();

    trailFadeT += dt;
    if (trailFadeT > 0.5) {
      tctx.globalCompositeOperation = 'destination-out';
      tctx.fillStyle = 'rgba(0,0,0,0.09)';
      tctx.fillRect(0, 0, W, H);
      tctx.globalCompositeOperation = 'source-over';
      trailFadeT = 0;
    }
  }

  function mergeGlassDrops() {
    const cs = 32, map = new Map();
    const key = (i, j) => i * 8192 + j;
    glassDrops.forEach((d, idx) => {
      if (d.dead) return;
      const k = key((d.x / cs) | 0, (d.y / cs) | 0);
      let a = map.get(k);
      if (!a) map.set(k, a = []);
      a.push(idx);
    });
    for (let i = 0; i < glassDrops.length; i++) {
      const d = glassDrops[i];
      if (d.dead || !(d.moving || d.fresh)) continue;
      const ci = (d.x / cs) | 0, cj = (d.y / cs) | 0;
      let merged = false;
      for (let a = -1; a <= 1; a++) {
        for (let b = -1; b <= 1; b++) {
          const list = map.get(key(ci + a, cj + b));
          if (!list) continue;
          for (const j of list) {
            if (j === i) continue;
            const o = glassDrops[j];
            if (o.dead) continue;
            const dx = o.x - d.x, dy = o.y - d.y, rr = (d.r + o.r) * 0.8;
            if (dx * dx + dy * dy < rr * rr) {
              // volume is conserved; the new centre is the volume-weighted average
              const V = d.V + o.V;
              d.x = (d.x * d.V + o.x * o.V) / V;
              d.y = (d.y * d.V + o.y * o.V) / V;
              d.V = V; setDropVolume(d);
              o.dead = true; merged = true;
            }
          }
        }
      }
      d.fresh = merged;
    }
    let w = 0;
    for (let i = 0; i < glassDrops.length; i++) if (!glassDrops[i].dead) glassDrops[w++] = glassDrops[i];
    glassDrops.length = w;
  }

  const shade = (() => {
    const c = mkCanvas(128, 128), s = c.getContext('2d');
    let gr = s.createRadialGradient(64, 72, 8, 64, 64, 64);
    // total internal reflection darkens the rim; light focused by the drop brightens the lower edge
    gr.addColorStop(0, 'rgba(255,255,255,0.08)');
    gr.addColorStop(0.6, 'rgba(0,0,0,0)');
    gr.addColorStop(0.86, 'rgba(0,0,0,0.16)');
    gr.addColorStop(1, 'rgba(0,0,0,0.36)');
    s.fillStyle = gr; s.beginPath(); s.arc(64, 64, 64, 0, TAU); s.fill();
    s.save();
    s.beginPath(); s.arc(64, 64, 63, 0, TAU); s.clip();
    gr = s.createRadialGradient(64, 64, 50, 64, 64, 66);
    gr.addColorStop(0, 'rgba(255,235,210,0)'); gr.addColorStop(0.6, 'rgba(255,235,210,0.28)'); gr.addColorStop(1, 'rgba(255,235,210,0)');
    s.fillStyle = gr;
    s.beginPath(); s.moveTo(64, 64); s.arc(64, 64, 66, 0.2 * Math.PI, 0.8 * Math.PI); s.closePath(); s.fill();
    s.restore();
    gr = s.createRadialGradient(48, 34, 0, 48, 34, 16);
    gr.addColorStop(0, 'rgba(255,255,255,0.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    s.fillStyle = gr; s.beginPath(); s.arc(48, 34, 16, 0, TAU); s.fill();
    return c;
  })();

  function drawGlass() {
    if (!state.glass) return;
    ctx.drawImage(trail, 0, 0, W, H);
    const fs = bgFlip.width / B;
    const rot = state.theta, cosT = Math.cos(rot), sinT = Math.sin(rot);
    const small = new Path2D();
    for (const d of glassDrops) {
      if (d.r < 1.6) {
        small.moveTo(d.x + d.r, d.y);
        small.arc(d.x, d.y, d.r, 0, TAU);
        continue;
      }
      if (d.r < 2.6 && !d.moving) {              // too small for the lens image to be visible
        ctx.drawImage(shade, d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
        continue;
      }
      // sliding drops: round advancing head, receding tail stretched behind (teardrop);
      // fresh impacts are still spread out (β_max ≈ 1.6) and recoil within ~80 ms
      const e = d.moving ? Math.min(0.6, d.speed / (PX_PER_MM * 120)) : 0;
      const sp = 1 + 0.6 * d.spread;
      const rx = d.r * (1 - e * 0.15) * sp, ry = d.r * sp;
      // where this point of the glass looks at in the (rotated) background
      const dx = d.x - W / 2, dy = d.y - H / 2;
      const bx = cosT * dx + sinT * dy + B / 2, by = -sinT * dx + cosT * dy + B / 2;
      const s = Math.min(bgFlip.width - 1, ry * 2 * LENS * fs);
      const sx = clamp((B - bx) * fs - s / 2, 0, bgFlip.width - s);
      const sy = clamp((B - by) * fs - s / 2, 0, bgFlip.height - s);
      const drot = e > 0.02 && d.rot !== undefined ? d.rot : rot;
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(drot);
      ctx.beginPath();
      const tail = ry * (1 + 1.6 * e);
      if (e > 0.02) {
        // +y points along gravity: head at +y, tail toward −y
        ctx.moveTo(-rx, 0);
        ctx.arc(0, 0, rx, Math.PI, 0, true);
        ctx.bezierCurveTo(rx, -tail * 0.45, rx * 0.25, -tail * 0.85, 0, -tail);
        ctx.bezierCurveTo(-rx * 0.25, -tail * 0.85, -rx, -tail * 0.45, -rx, 0);
      } else {
        ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
      }
      ctx.clip();
      ctx.rotate(-drot);
      const R = Math.max(rx, tail);
      ctx.drawImage(bgFlip, sx, sy, s, s, -R, -R, R * 2, R * 2);
      ctx.fillStyle = hazeStyle;              // the drop sees the same rain-scattered light as we do
      ctx.fillRect(-R, -R, R * 2, R * 2);
      if (flashLevel > 0.01) {                // …and the flash-lit sky, gathered by the lens
        ctx.fillStyle = `rgba(165,175,235,${Math.min(0.6, flashLevel * 0.5).toFixed(3)})`;
        ctx.fillRect(-R, -R, R * 2, R * 2);
      }
      ctx.rotate(drot);
      ctx.globalAlpha = 1 - 0.5 * d.spread;
      ctx.drawImage(shade, -rx, -tail, rx * 2, ry + tail);
      ctx.restore();
    }
    ctx.fillStyle = 'rgba(8,12,20,0.2)';
    ctx.fill(small);
  }

  // ---------- Lightning ----------
  const flashes = [];
  let flashLevel = 0, flashPeak = 1, flashX = 0, bolt = null, thunderInfo = null;

  // A cloud-to-ground discharge as a tortuous 3D channel (mean direction change ≈ 16° per
  // segment, Hill 1968) with branches and a horizontal in-cloud part. The same geometry is
  // drawn on screen and used to synthesise the thunder, so what you see is what you hear.
  function makeChannel(d, az, intraCloud = false) {
    const h = 1500 + Math.random() * 1500;                  // cloud base height (m)
    const gx = d * Math.sin(az), gz = d * Math.cos(az);
    const segs = [];                                        // [x1,y1,z1,x2,y2,z2,depth]
    function walk(x, y, z, dx, dy, dz, depth, stopY) {
      while (y > stopY) {
        const len = 15 + Math.random() * 45;
        // pull toward the strike point, randomised by ~16° tortuosity
        const tx = gx - x, tz = gz - z, ty = -HC - y, tl = Math.hypot(tx, ty, tz) || 1;
        dx = dx * 0.55 + tx / tl * 0.45 + (Math.random() - 0.5) * 0.55;
        dy = dy * 0.55 + ty / tl * 0.45 + (Math.random() - 0.5) * 0.3;
        dz = dz * 0.55 + tz / tl * 0.45 + (Math.random() - 0.5) * 0.55;
        const m = Math.hypot(dx, dy, dz); dx /= m; dy /= m; dz /= m;
        const nx = x + dx * len, ny = Math.max(stopY, y + dy * len), nz = z + dz * len;
        segs.push([x, y, z, nx, ny, nz, depth]);
        x = nx; y = ny; z = nz;
        if (depth < 2 && Math.random() < 0.06) {
          walk(x, y, z, dx + (Math.random() - 0.5) * 1.5, dy, dz + (Math.random() - 0.5) * 1.5, depth + 1, y - (y + HC) * (0.2 + Math.random() * 0.4));
        }
      }
    }
    const top = [gx + (Math.random() - 0.5) * 800, h, gz + (Math.random() - 0.5) * 800];
    if (!intraCloud) walk(top[0], top[1], top[2], 0, -1, 0, 0, -HC);
    // in-cloud horizontal channel: invisible, but responsible for the long rolling rumble
    let x = top[0], z = top[2], hx = Math.random() - 0.5, hz = Math.random() - 0.5;
    const L = intraCloud ? 3000 + Math.random() * 5000 : 1000 + Math.random() * 3000;
    for (let s = 0; s < L; s += 50) {
      hx += (Math.random() - 0.5) * 0.6; hz += (Math.random() - 0.5) * 0.6;
      const m = Math.hypot(hx, hz) || 1;
      const nx = x + hx / m * 50, nz = z + hz / m * 50;
      segs.push([x, h + 200, z, nx, h + 200 + (Math.random() - 0.5) * 60, nz, 9]);
      x = nx; z = nz;
    }
    return segs;
  }

  function lightning(tapX) {
    // distance of the strike (m); a tap asks for one close enough to see the channel
    const d = tapX === undefined ? 400 + Math.pow(Math.random(), 1.6) * 9000 : 300 + Math.random() * 3500;
    const az = Math.atan(((tapX ?? W * (0.1 + Math.random() * 0.8)) - cx) / f);
    // most natural flashes (~¾) never leave the cloud: a dimmer, longer flicker, no visible channel
    const ic = tapX === undefined && Math.random() < 0.6;
    const peak = (ic ? 0.35 : 1) * (0.2 + 0.8 * Math.min(1, 1500 / d));
    flashPeak = peak;
    let t = 0;
    const strokes = ic ? 3 + (Math.random() * 5 | 0) : 1 + (Math.random() * 4 | 0);   // return strokes / K-changes flicker
    for (let i = 0; i < strokes; i++) {
      flashes.push({ delay: t, peak: peak * (i ? 0.45 + Math.random() * 0.5 : 1), age: 0, tau: ic ? 0.12 : 0.06 });
      t += ic ? 0.08 + Math.random() * 0.25 : 0.04 + Math.random() * 0.12;
    }
    const channel = makeChannel(d, az, ic);
    flashX = cx + f * Math.tan(az);
    bolt = null;
    if (!ic && d < 8000) {
      const w = clamp(f * 6 / d, 0.8, 3.5);
      const segs = [];
      for (const [x1, y1, z1, x2, y2, z2, depth] of channel) {
        if (depth > 2 || z1 < 50 || z2 < 50) continue;
        segs.push([cx + f * x1 / z1, cy - f * y1 / z1, cx + f * x2 / z2, cy - f * y2 / z2, depth]);
      }
      bolt = { segs, w };
    }
    if (audio) audio.thunder(channel);
    // the first sound comes from the nearest point of the channel, not necessarily the strike point
    let rmin = Infinity;
    for (const sg of channel) rmin = Math.min(rmin, Math.hypot(sg[0], sg[1], sg[2]), Math.hypot(sg[3], sg[4], sg[5]));
    thunderInfo = { d, rmin, ic, t0: performance.now() };
    if (navigator.vibrate) navigator.vibrate(30);
  }

  function updateFlash(dt) {
    flashLevel = 0;
    for (let i = flashes.length - 1; i >= 0; i--) {
      const fl = flashes[i];
      fl.age += dt;
      const t = fl.age - fl.delay;
      if (t >= 0) flashLevel += fl.peak * Math.exp(-t / fl.tau);
      if (t > 10 * fl.tau) flashes.splice(i, 1);
    }
    if (!flashes.length) bolt = null;
  }

  function drawBolt() {
    if (!bolt || flashLevel < 0.02) return;
    const a = Math.min(1, flashLevel / flashPeak * 1.2);
    const paths = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
    for (const [x1, y1, x2, y2, depth] of bolt.segs) { paths[depth].moveTo(x1, y1); paths[depth].lineTo(x2, y2); }
    ctx.save();
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(170,190,255,0.9)';
    const defocus = state.glass ? 4 : 1;                    // eyes focused on the glass
    ctx.shadowBlur = 18 * defocus;
    paths.forEach((p, depth) => {
      ctx.strokeStyle = `rgba(240,244,255,${a * (1 - depth * 0.2) / Math.sqrt(defocus)})`;
      ctx.lineWidth = bolt.w * Math.pow(0.5, depth) * defocus;
      ctx.stroke(p);
    });
    ctx.restore();
  }

  // ---------- Audio (synthesized from physics, no files) ----------
  let audio = null;
  function createAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ac = new AC();
    const sr = ac.sampleRate;
    const rnd = Math.random;

    function noiseBuf(sec, pink) {
      const buf = ac.createBuffer(1, sr * sec, sr), d = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < d.length; i++) {
        const w = rnd() * 2 - 1;
        if (!pink) { d[i] = w * 0.5; continue; }
        b0 = 0.99765 * b0 + w * 0.0990460;
        b1 = 0.96300 * b1 + w * 0.2965164;
        b2 = 0.57000 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.18;
      }
      return buf;
    }
    const white = noiseBuf(2, false), pink = noiseBuf(4, true);
    const loop = buf => { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, rnd() * buf.duration); return s; };
    const filter = (type, freq, Q = 0.7, gain = 0) => {
      const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = freq; b.Q.value = Q; b.gain.value = gain; return b;
    };
    const gainNode = v => { const g = ac.createGain(); g.gain.value = v; return g; };

    // ---- mixing graph ----------------------------------------------------------------
    //  outdoor sources ─▶ outdoor ─┬───────────────▶ mix ─┬─▶ open window ────────────▶ master
    //                              └▶ street reverb ▶ mix └─▶ glass pane (mass law) ─▶ master
    //  sounds made on the pane itself (drop ticks, wind at the frame) ─────────────────▶ master
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 3;
    const master = gainNode(state.volume);
    master.connect(comp).connect(ac.destination);

    const outdoor = gainNode(1), mix = gainNode(1);
    outdoor.connect(mix);

    // Street-canyon reverb: synthetic impulse response with discrete early reflections from the
    // facade opposite (14 m → 82 ms), the ground, and a diffuse tail with RT60 ≈ 1.3 s
    const ir = ac.createBuffer(2, Math.floor(sr * 2.2), sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      const rt60 = 1.3, k = 6.91 / (rt60 * sr);
      for (let i = 0; i < d.length; i++) d[i] = (rnd() * 2 - 1) * Math.exp(-k * i) * 0.35 * Math.min(1, i / (0.03 * sr));
      for (const [ms, a] of [[18, 0.5], [82, 0.6], [97, 0.35], [164, 0.3], [190, 0.22], [246, 0.15]]) {
        const i = Math.floor((ms + (ch ? 3 : 0)) * sr / 1000);
        if (i < d.length) d[i] += a * (ch ? 0.9 : 1);
      }
    }
    const verb = ac.createConvolver();
    verb.buffer = ir;
    const verbSend = gainNode(0.28);
    outdoor.connect(verbSend).connect(verb).connect(mix);

    // Mass law: a 5 mm pane (m ≈ 12.5 kg/m²) transmits less and less as frequency rises,
    // TL ≈ 20·log10(m·f) − 47 dB → a 6 dB/octave (first-order) low-pass, plus a transmission
    // bump near the coincidence frequency f_c ≈ 12 000 / h[mm] ≈ 2.4 kHz
    const open = gainNode(state.glass ? 0 : 1), pane = gainNode(state.glass ? 1 : 0);
    let paneLP;
    const fc = 320, K = Math.tan(Math.PI * fc / sr);
    try { paneLP = ac.createIIRFilter([K / (1 + K), K / (1 + K)], [1, (K - 1) / (K + 1)]); }
    catch (_) { paneLP = filter('lowpass', fc, 0.5); }
    mix.connect(open).connect(master);
    mix.connect(paneLP).connect(filter('peaking', 2400, 1.4, 7)).connect(gainNode(0.9)).connect(pane).connect(master);

    const panner = (pan, dest) => {
      if (!ac.createStereoPanner) return dest;
      const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(dest); return p;
    };

    // ---- granular rain bed ---------------------------------------------------------------
    // Built from thousands of individual impacts rather than filtered noise. Impacts are spread
    // over the street with pdf ∝ r (ring area), amplitude ∝ D^1.5 / r, and air/ground absorption
    // dulls distant ones. On asphalt a drop makes a short broadband splat; in a puddle it may
    // entrain a bubble ringing at the Minnaert frequency — 1 mm drops make the characteristic
    // ~14 kHz "type I" bubbles (Pumphrey & Crum), larger drops 2–6 kHz ones.
    function rainBuffer(lambda, sec) {
      const len = Math.floor(sr * sec), buf = ac.createBuffer(2, len, sr);
      const L = buf.getChannelData(0), R = buf.getChannelData(1);
      const n = Math.floor(lambda * sec);
      for (let e = 0; e < n; e++) {
        const t0 = Math.floor(rnd() * len);
        const r = Math.sqrt(16 + rnd() * (1600 - 16));    // 4 … 40 m
        const D = 0.5 - Math.log(1 - rnd()) * 0.6;
        const amp = Math.pow(D, 1.5) / r;
        const fcut = clamp(16000 * 12 / r, 1200, 16000), a1 = Math.exp(-TAU * fcut / sr);
        const az = (rnd() - 0.5) * Math.PI, gl = Math.cos(az / 2 + Math.PI / 4), gr = Math.sin(az / 2 + Math.PI / 4);
        let y = 0;
        if (rnd() < 0.2) {
          const typeI = D > 0.8 && D < 1.2 && rnd() < 0.6;
          const f0 = typeI ? 12500 + rnd() * 3500 : 3260 / (0.5 + rnd() * 1.0);
          const tau = 1 / (Math.PI * f0 * 0.045);                 // radiation + thermal damping δ ≈ 0.045
          const m = Math.floor(tau * 5 * sr);
          for (let k = 0; k < m; k++) {
            const t = k / sr;
            const v = Math.sin(TAU * f0 * t * (1 + 0.15 * t / (tau * 5))) * Math.exp(-t / tau) * amp * 0.6;
            y = y * a1 + v * (1 - a1);
            const i = (t0 + k) % len;
            L[i] += y * gl; R[i] += y * gr;
          }
        } else {
          const m = Math.floor((0.0015 + 0.0015 * D) * sr), tau = m / 4;
          for (let k = 0; k < m; k++) {
            const v = (rnd() * 2 - 1) * Math.exp(-k / tau) * amp;
            y = y * a1 + v * (1 - a1);
            const i = (t0 + k) % len;
            L[i] += y * gl; R[i] += y * gr;
          }
        }
      }
      // normalise loudness (RMS), not peak: sparse impact trains have a high crest factor
      let ss = 0;
      for (let i = 0; i < len; i++) ss += L[i] * L[i] + R[i] * R[i];
      const norm = 0.12 / (Math.sqrt(ss / (2 * len)) || 1);
      for (let i = 0; i < len; i++) { L[i] = Math.tanh(L[i] * norm); R[i] = Math.tanh(R[i] * norm); }
      return buf;
    }
    const lightGain = gainNode(0), heavyGain = gainNode(0);
    const lightSrc = ac.createBufferSource(), heavySrc = ac.createBufferSource();
    lightSrc.buffer = rainBuffer(700, 5); lightSrc.loop = true;
    heavySrc.buffer = rainBuffer(6000, 4); heavySrc.loop = true;
    lightSrc.connect(lightGain).connect(outdoor);
    heavySrc.connect(heavyGain).connect(outdoor);
    lightSrc.start(); heavySrc.start();
    // distant rain on roofs and the whole city merges into a low roar
    const roarGain = gainNode(0);
    loop(pink).connect(filter('lowpass', 500)).connect(roarGain).connect(outdoor);

    // ---- wind ------------------------------------------------------------------------------
    // Aerodynamic (dipole) sound power grows ∝ U⁶ (Curle), so amplitude ∝ U³.
    // Flow past a cylinder sheds vortices at f = St·U/d (St ≈ 0.2): power lines (d ≈ 6 mm)
    // and the window frame (d ≈ 25 mm) sing Aeolian tones that follow the gusts.
    const windGain = gainNode(0), windBP = filter('bandpass', 200, 0.6);
    loop(pink).connect(windBP).connect(windGain).connect(outdoor);
    const aeolian = [0.006, 0.025].map((d, i) => {
      const bp = filter('bandpass', 400, 30), g = gainNode(0);
      loop(white).connect(bp).connect(g).connect(i ? master : outdoor);
      return { d, bp, g };
    });

    // A drop hitting a nearby puddle: a single bubble at its Minnaert resonance f ≈ 3.26 / a
    function plink() {
      const a = 0.4 + rnd() ** 2 * 1.1;   // mm
      const fr = 3260 / a;
      const t = ac.currentTime + rnd() * 0.02;
      const o = ac.createOscillator();
      o.frequency.setValueAtTime(fr, t);
      o.frequency.exponentialRampToValueAtTime(fr * 1.25, t + 0.04);
      const g = ac.createGain();
      const amp = 0.01 + rnd() * 0.035, dur = 0.02 + a * 0.02;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(panner(rnd() * 1.6 - 0.8, outdoor));
      o.start(t); o.stop(t + dur + 0.02);
    }

    // A drop striking the pane right in front of you: heard directly, not through the glass
    let tickBudget = 0, lastTick = 0;
    function tick(D, pan) {
      const t = ac.currentTime;
      tickBudget = Math.max(0, tickBudget - (t - lastTick) * 25); lastTick = t;
      if (tickBudget > 6) return;
      tickBudget++;
      const s = ac.createBufferSource(); s.buffer = white;
      const g = ac.createGain();
      g.gain.setValueAtTime(Math.min(0.35, 0.035 * D * D), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.025 + 0.008 * D);
      s.connect(filter('bandpass', 1800 + 3500 / D, 1.3)).connect(g).connect(panner(pan, master));
      s.start(t, rnd() * 1.5, 0.1);
    }

    // Thunder synthesised from the channel geometry (Few 1969; Ribner & Roy 1982):
    // every few metres of channel emits an N-wave; it arrives after r / c, with amplitude ∝ ΔL / r
    // and strongest broadside to the segment. Segments perpendicular to the line of sight arrive
    // together as a sharp "clap"; the spread of path lengths makes the long rumble. N-waves
    // lengthen with distance (nonlinear propagation) and air absorption removes the highs.
    function thunder(channel) {
      const em = [];
      let rmin = Infinity, rmax = 0;
      for (const [x1, y1, z1, x2, y2, z2] of channel) {
        const sl = Math.hypot(x2 - x1, y2 - y1, z2 - z1), n = Math.max(1, Math.round(sl / 4));
        const ux = (x2 - x1) / sl, uy = (y2 - y1) / sl, uz = (z2 - z1) / sl;
        for (let k = 0; k < n; k++) {
          const t = (k + 0.5) / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t, z = z1 + (z2 - z1) * t;
          const r = Math.hypot(x, y, z);
          const cosA = (ux * x + uy * y + uz * z) / r;
          em.push([r, sl / n, 1 - cosA * cosA]);
          rmin = Math.min(rmin, r); rmax = Math.max(rmax, r);
        }
      }
      const len = Math.floor(((rmax - rmin) / SOUND_SPEED + 1.5) * sr);
      const buf = ac.createBuffer(2, len, sr), L = buf.getChannelData(0), Rc = buf.getChannelData(1);
      for (const [r, dl, broad] of em) {
        const i0 = Math.floor((r - rmin) / SOUND_SPEED * sr);
        const T = 0.004 * Math.pow(r / 100, 0.25);             // N-wave duration (s)
        const fc = clamp(8000 * 300 / r, 60, 8000), a1 = Math.exp(-TAU * fc / sr);
        const amp = 16 * dl * (0.15 + broad) / r * (0.8 + Math.random() * 0.4);
        const nT = Math.floor(T * sr), m = nT + Math.floor(4 * sr / (TAU * fc));
        const pan = (Math.random() - 0.5) * 0.6, gl = 1 - pan, gr = 1 + pan;
        let y = 0;
        for (let k = 0; k < m && i0 + k < len; k++) {
          const v = k < nT ? amp * (1 - 2 * k / nT) : 0;
          y = y * a1 + v * (1 - a1);
          L[i0 + k] += y * gl; Rc[i0 + k] += y * gr;
        }
      }
      for (let i = 0; i < len; i++) { L[i] = Math.tanh(L[i]); Rc[i] = Math.tanh(Rc[i]); }
      const s = ac.createBufferSource();
      s.buffer = buf;
      const g = gainNode(1);
      s.connect(g).connect(outdoor);
      g.connect(verbSend);                                       // extra echoes off buildings
      s.start(ac.currentTime + rmin / SOUND_SPEED);
    }

    function update() {
      const now = ac.currentTime, R = state.rateNow, u = Math.abs(state.wind);
      master.gain.setTargetAtTime(state.volume * state.fade, now, 0.1);
      open.gain.setTargetAtTime(state.glass ? 0 : 1, now, 0.25);
      pane.gain.setTargetAtTime(state.glass ? 1 : 0, now, 0.25);
      // acoustic power ∝ number of impacts ∝ R; blend a sparse and a dense texture by log R
      const x = clamp(Math.log(R / 0.3) / Math.log(100 / 0.3), 0, 1);
      const lvl = 0.2 + 0.8 * Math.sqrt(Math.min(1, R / 100));
      lightGain.gain.setTargetAtTime(Math.cos(x * Math.PI / 2) * lvl * 1.4, now, 0.4);
      heavyGain.gain.setTargetAtTime(Math.sin(x * Math.PI / 2) * lvl, now, 0.4);
      roarGain.gain.setTargetAtTime(0.12 * Math.sqrt(Math.min(1, R / 100)), now, 0.5);
      const w3 = Math.min(1.5, (u / 12) ** 3);
      windGain.gain.setTargetAtTime(0.9 * w3, now, 0.15);
      windBP.frequency.setTargetAtTime(90 + u * 22, now, 0.15);
      for (const a of aeolian) {
        a.bp.frequency.setTargetAtTime(clamp(0.2 * Math.max(u, 0.5) / a.d, 40, 4000), now, 0.12);
        a.g.gain.setTargetAtTime(u > 4 ? 0.9 * w3 : 0, now, 0.2);
      }
    }
    update();
    // a passing car: tyre hiss on the wet road + low rolling noise, Doppler-shifted by
    // changing the playback rate (which scales the whole spectrum), air absorption by distance
    function carVoice() {
      const hiss = loop(white), roll = loop(pink);
      const bp = filter('bandpass', 1600, 0.5), air = filter('lowpass', 8000), g = gainNode(0), g2 = gainNode(0);
      const out = panner(0, outdoor);
      hiss.connect(bp).connect(air).connect(g).connect(out);
      roll.connect(filter('lowpass', 160)).connect(g2).connect(out);
      const pan = out.pan;
      return {
        set(amp, rate, p, r) {
          const now = ac.currentTime;
          hiss.playbackRate.setTargetAtTime(rate, now, 0.05);
          roll.playbackRate.setTargetAtTime(rate, now, 0.05);
          g.gain.setTargetAtTime(0.35 * amp, now, 0.05);
          g2.gain.setTargetAtTime(0.5 * amp, now, 0.05);
          air.frequency.setTargetAtTime(clamp(16000 * 15 / r, 900, 16000), now, 0.1);
          if (pan) pan.setTargetAtTime(clamp(p, -1, 1), now, 0.05);
        },
        stop() {
          const now = ac.currentTime;
          g.gain.setTargetAtTime(0, now, 0.1); g2.gain.setTargetAtTime(0, now, 0.1);
          hiss.stop(now + 0.6); roll.stop(now + 0.6);
        },
      };
    }
    // an eaves drop landing in the little puddle on the sill: the impact "plop" (collapse of
    // the crater, a few hundred Hz) and then a large bubble ringing at 1.3–2.6 kHz
    function drip(delay) {
      const t = ac.currentTime + delay;
      const out = panner(0.55, outdoor);
      const f0 = 3260 / (1.25 + rnd() * 1.25);
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 1.45, t + 0.07);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + 0.12);
      const s = ac.createBufferSource(), g2 = ac.createGain();
      s.buffer = white;
      g2.gain.setValueAtTime(0.5, t);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
      s.connect(filter('lowpass', 700)).connect(g2).connect(out);
      s.start(t, rnd(), 0.05);
    }
    return { ac, master, plink, tick, thunder, update, carVoice, drip };
  }

  // ---------- Resize ----------
  // At night a window is also a faint mirror: glass reflects ≈ 4 % per surface (Fresnel,
  // n = 1.52), so the warmly lit room behind you shows up, softly out of focus. And a gentle
  // vignette, like the natural fall-off of our peripheral vision.
  let reflection, vignette;
  function paintOverlays() {
    reflection = mkCanvas(W, H);
    const r = reflection.getContext('2d');
    let gr = r.createRadialGradient(W * 0.82, H * 0.22, 0, W * 0.82, H * 0.22, W * 0.5);
    gr.addColorStop(0, 'rgba(255,196,130,1)');
    gr.addColorStop(0.25, 'rgba(255,170,100,0.45)');
    gr.addColorStop(1, 'rgba(255,150,80,0)');
    r.fillStyle = gr; r.fillRect(0, 0, W, H);
    gr = r.createLinearGradient(0, H * 0.55, 0, H);                    // lit desk / sill
    gr.addColorStop(0, 'rgba(120,90,60,0)'); gr.addColorStop(1, 'rgba(120,90,60,0.5)');
    r.fillStyle = gr; r.fillRect(0, H * 0.55, W, H * 0.45);
    for (let x = 0; x < W * 0.16; x += 14) {                            // curtain folds at the edge
      r.fillStyle = `rgba(200,170,140,${(0.22 + 0.15 * Math.sin(x * 0.45)).toFixed(3)})`;
      r.fillRect(x, 0, 9, H);
    }
    // the room is ~2 m behind us, so its mirror image is far out of focus
    let cur = reflection;
    for (let k = 0; k < 4; k++) { const n = mkCanvas(cur.width / 2, cur.height / 2); n.getContext('2d').drawImage(cur, 0, 0, n.width, n.height); cur = n; }
    for (let k = 0; k < 2; k++) { const n = mkCanvas(cur.width * 2, cur.height * 2); n.getContext('2d').drawImage(cur, 0, 0, n.width, n.height); cur = n; }
    reflection = cur;
    vignette = mkCanvas(W, H);
    const v = vignette.getContext('2d');
    gr = v.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.hypot(W, H) * 0.62);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.42)');
    v.fillStyle = gr; v.fillRect(0, 0, W, H);
  }

  // Splash mist: in heavy rain the impacts atomise into fine droplets that hang in a thin
  // layer over the road and drift with the wind (a tileable texture at two depths)
  const mistTex = (() => {
    const c = mkCanvas(1024, 64), g = c.getContext('2d');
    for (let i = 0; i < 110; i++) {
      const x = Math.random() * 1024, y = 26 + Math.random() * 26, r = 20 + Math.random() * 60;
      for (const dx of [-1024, 0, 1024]) {
        g.save();
        g.translate(x + dx, y); g.scale(1, 0.3);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
        gr.addColorStop(0, 'rgba(200,210,230,0.14)'); gr.addColorStop(1, 'rgba(200,210,230,0)');
        g.fillStyle = gr;
        g.fillRect(-r, -r, r * 2, r * 2);
        g.restore();
      }
    }
    // densest just above the road, thinning out upward and toward the surface
    g.globalCompositeOperation = 'destination-in';
    const m = g.createLinearGradient(0, 0, 0, 64);
    m.addColorStop(0, 'rgba(0,0,0,0)'); m.addColorStop(0.65, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = m; g.fillRect(0, 0, 1024, 64);
    return c;
  })();
  function drawMist() {
    const a = 0.6 * (1 - Math.exp(-state.rateNow / 35));
    if (a < 0.03) return;
    ctx.globalAlpha = a * 0.4;
    for (const z of [5, 7.5, 11, 16, 24]) {
      const h = f * 0.9 / z, gy = cy + f * HC / z;                 // ~0.9 m thick layer
      const w = h * 16;                                            // texture aspect 16:1
      let off = (-(time * state.wind * f / z) % w + w) % w;
      const o2 = (z * 137) % w;                                    // decorrelate the layers
      for (let x = -ox - off - o2; x < W + ox; x += w) ctx.drawImage(mistTex, x, gy - h * 0.8, w, h);
    }
    ctx.globalAlpha = 1;
  }

  let renderScale = 1;
  function sizeCanvases() {
    DPR = Math.min(window.devicePixelRatio || 1, 2) * renderScale;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    trail.width = canvas.width; trail.height = canvas.height;
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    sizeCanvases();
    B = Math.ceil(Math.hypot(W, H)) + 8;
    ox = (B - W) / 2; oy = (B - H) / 2;
    f = 0.62 * Math.hypot(W, H);
    cx = W / 2; cy = H * 0.42;
    paintBackground();
    paintOverlays();
    initPinGrid();
    drops.length = 0; splashes.length = 0; ripples.length = 0;
    glassDrops.length = 0; seedGlass();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Tilt: real gravity from the accelerometer ----------
  const rawG = { x: 0, y: G };
  let gSign = 0;
  window.addEventListener('devicemotion', e => {
    if (!state.tilt) return;
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null) return;
    const ang = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * Math.PI / 180;
    const sx = a.x * Math.cos(ang) - a.y * Math.sin(ang);
    const sy = a.x * Math.sin(ang) + a.y * Math.cos(ang);
    // browsers disagree on the sign convention; calibrate assuming the phone starts roughly upright
    if (!gSign && Math.abs(sy) > 3) gSign = sy > 0 ? 1 : -1;
    const s = gSign || 1;
    rawG.x = -s * sx; rawG.y = s * sy;
  });

  function updateGravity(dt) {
    const k = Math.min(1, dt * 8);
    let tx = 0, ty = 1, tip = 1;
    if (state.tilt) {
      const m = Math.hypot(rawG.x, rawG.y);
      tip = Math.min(1, m / G);
      if (m > 2.5) { tx = rawG.x / m; ty = rawG.y / m; } else { tx = state.gx; ty = state.gy; }
    }
    state.gip += (tip - state.gip) * k;
    state.gx += (tx - state.gx) * k; state.gy += (ty - state.gy) * k;
    const m = Math.hypot(state.gx, state.gy) || 1;
    state.gx /= m; state.gy /= m;
    state.theta = Math.atan2(-state.gx, state.gy);
  }

  // ---------- Loop ----------
  const hud = document.getElementById('hud');
  const statsEl = document.getElementById('stats');
  let last = performance.now(), time = 0, nextAutoBolt = 10, plinkAcc = 0, audioT = 0, statsT = 0;

  function frame(now) {
    adaptQuality(now - last);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; time += dt;

    state.wind = state.wind0 + (0.35 * Math.abs(state.wind0) + 0.6) * gustField(0, 5, time);
    state.rateNow = state.rate * Math.exp(0.28 * pink1(time * 0.05, 500));

    if (state.rate > 25) {
      nextAutoBolt -= dt;
      if (nextAutoBolt <= 0) { lightning(); nextAutoBolt = 5 + Math.random() * 20 * (60 / state.rate); }
    }

    updateGravity(dt);
    updateFlash(dt);
    updateRain(dt);
    updateGlass(dt);
    updateCars(dt);
    updateDrips(dt);

    if (audio) {
      plinkAcc += dt * Math.min(35, 1.5 * Math.pow(state.rateNow, 0.7)) * (state.glass ? 0.5 : 1);
      while (plinkAcc >= 1) { if (Math.random() < 0.9) audio.plink(); plinkAcc--; }
      audioT += dt;
      if (audioT > 0.1) { audio.update(); audioT = 0; }
    }

    render();

    statsT += dt;
    if (statsT > 0.25) { updateStats(); statsT = 0; }
    requestAnimationFrame(frame);
  }

  let hazeStyle = 'rgba(0,0,0,0)';
  // Adaptive quality: compare the frame time with the display's own refresh interval
  // (the fastest we have seen) and shed or restore detail to stay smooth on older phones.
  let quality = 1, ftAvg = 16.7, ftBase = 1000, qualityT = 0;
  function adaptQuality(ms) {
    if (ms <= 0 || ms > 250) return;                         // tab switches, hiccups
    ftAvg += (ms - ftAvg) * 0.08;
    ftBase = Math.min(17.5, ftBase * 1.0005, ftAvg);         // displays refresh at ≥ 60 Hz
    qualityT += ms / 1000;
    if (qualityT < 1) return;
    qualityT = 0;
    if (ftAvg > ftBase * 1.22 && quality > 0.35) quality *= 0.85;
    else if (ftAvg < ftBase * 1.08 && quality < 1) quality = Math.min(1, quality * 1.04);
    // last resort: fewer pixels (GPU fill rate), restored once there is headroom again
    const want = quality < 0.45 ? 0.7 : quality > 0.9 ? 1 : renderScale;
    if (want !== renderScale) { renderScale = want; sizeCanvases(); }
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save();
    if (state.theta) {
      ctx.translate(W / 2, H / 2); ctx.rotate(state.theta); ctx.translate(-W / 2, -H / 2);
    }
    const Ly = state.glass ? layers.blur : layers.sharp;
    const fl = Math.min(1, flashLevel);
    ctx.drawImage(Ly.sky, -ox, -oy, B, B);
    if (fl > 0.01) {
      ctx.globalAlpha = fl;
      ctx.drawImage(Ly.skyLit, -ox, -oy, B, B);
      // the cloud glows brightest around where the channel enters it
      ctx.globalCompositeOperation = 'lighter';
      const r = H * 0.7, gr = ctx.createRadialGradient(flashX, -oy, 0, flashX, -oy, r);
      gr.addColorStop(0, 'rgba(170,180,255,0.5)'); gr.addColorStop(1, 'rgba(170,180,255,0)');
      ctx.fillStyle = gr;
      ctx.fillRect(-ox, -oy, B, cy + oy);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    drawBolt();
    ctx.drawImage(Ly.front, -ox, -oy, B, B);
    if (fl > 0.01) {
      ctx.globalAlpha = fl * 0.8;
      ctx.drawImage(Ly.puddleLit, -ox, -oy, B, B);
      ctx.globalAlpha = 1;
    }
    drawCars();
    // heavy rain scatters light: visibility drops as the rain rate rises
    hazeStyle = `rgba(55,60,75,${(0.28 * (1 - Math.exp(-state.rateNow / 40))).toFixed(3)})`;
    ctx.fillStyle = hazeStyle;
    ctx.fillRect(-ox, -oy, B, B);
    drawMist();
    drawRain();
    ctx.restore();

    if (state.glass) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.12 * (1 - Math.min(1, flashLevel));   // a bright outside washes it out
      ctx.drawImage(reflection, 0, 0, W, H);
      ctx.restore();
    }
    drawGlass();
    ctx.drawImage(vignette, 0, 0, W, H);

    if (flashLevel > 0.005) {
      const fl = Math.min(1.2, flashLevel);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, `rgba(150,160,210,${fl * 0.16})`);
      gr.addColorStop(0.45, `rgba(150,160,210,${fl * 0.1})`);
      gr.addColorStop(1, `rgba(120,130,170,${fl * 0.06})`);
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  // Sleep timer: the last 90 s fade out linearly in decibels (to −40 dB), which the ear hears
  // as an even, natural fade rather than a sudden drop at the end
  const TIMER_STEPS = [0, 15, 30, 60];
  let timerIdx = 0;
  function updateTimer() {
    const btn = document.getElementById('timerBtn');
    if (!state.timerEnd) { state.fade = 1; btn.textContent = 'タイマー'; return; }
    const rem = (state.timerEnd - performance.now()) / 1000;
    state.fade = rem > 90 ? 1 : rem > 0 ? Math.pow(10, -40 * (1 - rem / 90) / 20) : 0;
    btn.textContent = rem > 0 ? `⏲ ${Math.ceil(rem / 60)}分` : '⏲ 終了';
    if (rem <= 0 && audio && audio.ac.state === 'running') audio.ac.suspend();
  }

  function updateStats() {
    updateTimer();
    const R = state.rateNow, L = mpLambda(R), meanD = 0.5 + 1 / L;
    statsEl.innerHTML =
      `降水強度 ${R.toFixed(1)} mm/h（${rainClass(R)}）・風速 ${state.wind.toFixed(1)} m/s<br>` +
      `平均雨滴径 ${meanD.toFixed(2)} mm・終端速度 ${termVel(meanD).toFixed(1)} m/s・` +
      `描画中の雨滴 ${drops.length} / 窓 ${glassDrops.length}` +
      (quality < 0.98 ? `・描画品質 ${Math.round(quality * 100)}%` : '');
    if (thunderInfo) {
      const el = (performance.now() - thunderInfo.t0) / 1000, eta = thunderInfo.rmin / SOUND_SPEED;
      const km = ((thunderInfo.ic ? thunderInfo.rmin : thunderInfo.d) / 1000).toFixed(1);
      const what = thunderInfo.ic ? '☁ 雲の中で放電' : '⚡ 落雷';
      if (el < eta) hud.textContent = `${what} ${km} km — 雷鳴まで ${(eta - el).toFixed(1)} 秒`;
      else if (el < eta + 6) hud.textContent = `${what} ${km} km — ゴロゴロ…`;
      else thunderInfo = null;
      hud.style.opacity = thunderInfo ? 1 : 0;
    }
  }

  requestAnimationFrame(frame);
  if (location.hash === '#debug') window.__rain = { state, makeChannel, lightning, cars, spawnCar, get audio() { return audio; } };

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  const panel = $('panel');

  function bindSlider(id, apply, fmt) {
    const el = $(id), val = $(id + 'Val');
    const sync = () => { apply(+el.value); val.textContent = fmt(); if (audio) audio.update(); };
    el.addEventListener('input', sync);
    sync();
    return el;
  }
  bindSlider('rate', v => state.rate = rateFromSlider(v), () => `${state.rate.toFixed(1)} mm/h`);
  const windSlider = bindSlider('wind', v => state.wind0 = v / 10, () => `${state.wind0.toFixed(1)} m/s`);
  bindSlider('volume', v => state.volume = v / 100, () => `${Math.round(state.volume * 100)}%`);

  function setWind(v) {
    state.wind0 = clamp(v, -15, 15);
    windSlider.value = Math.round(state.wind0 * 10);
    $('windVal').textContent = `${state.wind0.toFixed(1)} m/s`;
  }

  $('startBtn').addEventListener('click', () => {
    audio = createAudio();
    if (audio && audio.ac.state === 'suspended') audio.ac.resume();
    $('start').remove();
  });

  $('toggle').addEventListener('click', () => panel.classList.toggle('hidden'));

  $('glassBtn').addEventListener('click', e => {
    state.glass = !state.glass;
    e.currentTarget.classList.toggle('on', state.glass);
    tctx.clearRect(0, 0, W, H);
    initPinGrid();
    if (state.glass) seedGlass();
  });

  $('thunderBtn').addEventListener('click', () => lightning());

  $('timerBtn').addEventListener('click', e => {
    timerIdx = (timerIdx + 1) % TIMER_STEPS.length;
    const min = TIMER_STEPS[timerIdx];
    state.timerEnd = min ? performance.now() + min * 60000 : 0;
    e.currentTarget.classList.toggle('on', !!min);
    if (audio && audio.ac.state === 'suspended') audio.ac.resume();
    updateTimer();
  });

  $('tiltBtn').addEventListener('click', async e => {
    const btn = e.currentTarget;
    if (!state.tilt && typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        if (await DeviceMotionEvent.requestPermission() !== 'granted') return;
      } catch (_) { return; }
    }
    state.tilt = !state.tilt;
    gSign = 0;
    btn.classList.toggle('on', state.tilt);
  });

  // tap = lightning, horizontal swipe = wind
  let touchStart = null;
  canvas.addEventListener('pointerdown', e => {
    touchStart = { x: e.clientX, wind: state.wind0, moved: false };
  });
  canvas.addEventListener('pointermove', e => {
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x;
    if (Math.abs(dx) > 10) touchStart.moved = true;
    if (touchStart.moved) setWind(touchStart.wind + dx / (W * 0.6) * 15);
  });
  canvas.addEventListener('pointerup', e => {
    if (touchStart && !touchStart.moved) lightning(e.clientX);
    touchStart = null;
  });
  canvas.addEventListener('pointercancel', () => touchStart = null);

  // iOS suspends audio when the app goes to background
  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.ac.suspend(); else audio.ac.resume();
  });
})();
</script>
</body>
</html>
